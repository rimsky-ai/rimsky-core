persistence:
  driver: sqlite
  sqlite:
    path: /var/lib/rimsky/state.db
claim_producers: {}
named_locks: {}
executors: {}
publishers:
  "watch":
    endpoint: "http-sensor:9082"
    protocols: ["publisher"]
  "watch-filtered":
    endpoint: "http-sensor:9082"
    protocols: ["publisher"]
  "watch-notfound":
    endpoint: "http-sensor:9082"
    protocols: ["publisher"]
  "watch-blocked":
    endpoint: "http-sensor-guarded:9082"
    protocols: ["publisher"]
