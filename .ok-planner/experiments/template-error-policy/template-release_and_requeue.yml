name: audit-error-policy-release_and_requeue
version: v1
nodes:
  - type: failing
    executor: verifier-shape-checks
    error_types:
      "verifier/check_failed/row_count_absolute":
        action: release_and_requeue
    attributes:
      schema:
        type: object
        properties:
          checks:
            type: array
            default:
              - kind: row_count_absolute
                config:
                  min: 1
