name: audit-error-policy-give_up
version: v1
nodes:
  - type: failing
    executor: verifier-shape-checks
    error_types:
      "verifier/check_failed/row_count_absolute":
        action: give_up
    attributes:
      schema:
        type: object
        properties:
          checks:
            type: array
            default:
              - kind: row_count_absolute
                config:
                  min: 1
