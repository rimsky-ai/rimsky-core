syntax = "proto3";

package rimsky.v1;

option go_package = "github.com/fallguy/rimsky/protocols/proto/v1/gen;genv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ExecutorObservability is the optional read-only protocol every
// executor MAY implement to expose per-dispatch traces to dashboards.
// The dispatch protocol (executor.proto) is unchanged. See
// docs/specs/2026-05-02-dashboard-and-observability-design.md §2.
service ExecutorObservability {
  rpc Capabilities(ExecutorCapabilitiesRequest) returns (ObservabilityCapabilities);
  rpc GetTrace(GetTraceRequest) returns (Trace);
  rpc StreamTrace(StreamTraceRequest) returns (stream TraceEvent);
}

message ExecutorCapabilitiesRequest {}

message ObservabilityCapabilities {
  bool supports_trace_get = 1;
  bool supports_trace_stream = 2;
  uint64 retention_after_terminal_seconds = 3;
  CustomUI custom_ui = 4;
  // http_bridge_url, when non-empty, is the absolute base URL the service
  // serves the HTTP+JSON observability bridge on. Dashboard clients
  // dial this URL directly for browser-friendly fetch/SSE access. When
  // empty, services expose only the gRPC surface.
  string http_bridge_url = 5;

  // expected_attributes_schema is a JSON Schema (RFC 8259 + draft 2020-12)
  // describing the executor's accepted attribute shape. Empty means "no
  // schema; accept any attributes."
  //
  // Each property in the schema is one of:
  //   - an *input* the executor consumes at dispatch (no `readOnly`); or
  //   - an *output* the executor produces at commit write-back, marked
  //     `readOnly: true` per the JSON Schema standard keyword.
  //
  // Rimsky merges this schema with template-level defaults (L1) and
  // per-node declarations (L2) at registration to compute the effective
  // attribute schema, then validates the post-substitution attribute bag
  // at dispatch and the post-write-back bag at commit. Validation
  // failures route through Error { error_class: "template_validation_failed" }.
  bytes expected_attributes_schema = 6;

  // declared_events is the set of event names this executor may emit
  // via the NamedEvent wire type on ExecuteEvent. Empty means
  // "executor does not emit events."
  //
  // Rimsky validates that any on_event handlers in templates referencing
  // this executor name an event in declared_events. Reserved lifecycle
  // slots (on_executor_complete/errored, on_acquire_unavailable) are
  // not subject to this validation.
  repeated string declared_events = 7;
}

message CustomUI {
  string ui_url = 1;
  EmbedMode embed_mode = 2;
  string dispatch_url_template = 3;
}

enum EmbedMode {
  EMBED_MODE_UNSPECIFIED = 0;
  LINK = 1;
  IFRAME = 2;
  BOTH = 3;
}

message GetTraceRequest {
  string dispatch_id = 1;
}

message StreamTraceRequest {
  string dispatch_id = 1;
}

message Trace {
  string dispatch_id = 1;
  bool evicted = 2;
  bool complete = 3;
  repeated TraceEvent events = 4;
}

message TraceEvent {
  string event_id = 1;
  string parent_event_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  Severity severity = 4;
  string category = 5;
  string message = 6;
  google.protobuf.Struct attributes = 7;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}
