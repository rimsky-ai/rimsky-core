// Validation is a mix-in service-protocol any service binary may
// advertise alongside its primary protocol (executor, claim_producer,
// lifecycle_subscriber, sensor). Rimsky invokes Validate at template
// registration with the role-specific context built from the
// canonicalized template; the service may reject the registration
// outright via valid=false errors, or surface warnings.
//
// Per spec .ok-planner/specs/2026-05-15-data-platform-extensions-design.md
// §Protocol surfaces / Validation.

syntax = "proto3";

package rimsky.v1;

option go_package = "github.com/fallguyconsulting/rimsky/protocols/proto/v1/gen;genv1";

service Validation {
  // Validate is a single request-response RPC; the request is
  // self-describing via the role oneof. Implementations route on the
  // oneof variant.
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

message ValidateRequest {
  // role is the discriminator; matches one of the strings advertised
  // in the service's primary capabilities `validation_supported_roles`.
  string role = 1;
  oneof context {
    ExecutorContext            executor             = 2;
    ClaimProducerContext       claim_producer       = 3;
    LifecycleSubscriberContext lifecycle_subscriber = 4;
    SensorContext              sensor               = 5;
  }
}

// ExecutorContext carries the executor-side binding rimsky sees at
// template registration: the merged effective attribute schema for the
// node and the node-local claim aliases the executor will see at
// dispatch.
message ExecutorContext {
  string node_alias        = 1;
  // Reserved (was: bytes userdata = 2). Userdata retired in the
  // 2026-05-21 collapse; the pipeline now operates against the merged
  // effective attribute schema carried in `attributes_schema` below.
  reserved 2;
  reserved "userdata";
  bytes  attributes_schema = 3;
  // claim_aliases lists the per-node aliases (claims + holds) the
  // executor will receive in ExecuteRequest.stores at dispatch.
  repeated string claim_aliases = 4;
}

// ClaimProducerContext carries the per-claim-binding rimsky sees at
// canonicalization. The producer may reject malformed `data:` or
// partition_request shapes here (the bytes are opaque to rimsky).
message ClaimProducerContext {
  string producer_name = 1;
  repeated ClaimBinding claims = 2;
}

message ClaimBinding {
  string node_alias            = 1;
  string claim_alias           = 2;
  string selector              = 3;
  string intent                = 4;
  // lifetime: "subgraph" | "durable".
  string lifetime              = 5;
  // data is the opaque-to-rimsky `data:` block on the claim, surfaced
  // verbatim to the producer for shape validation.
  bytes  data                  = 6;
  // partition_request is the canonicalized `fan_out.partition_request`
  // literal (or its `default` clause when it is a substitution
  // template). Empty when the node does not fan out against this
  // claim.
  bytes  partition_request     = 7;
}

message LifecycleSubscriberContext {
  string subscriber_name = 1;
  // template_id is the content-hash id; the subscriber may consult its
  // own state for prior lifecycle events bound to this template.
  string template_id = 2;
}

message SensorContext {
  string sensor_name = 1;
  // kind is the sensor-kind discriminator (e.g. "cron", "http").
  string kind = 2;
  // resolved_config is the per-instance config the sensor will receive
  // at Subscribe.
  bytes resolved_config = 3;
}

message ValidateResponse {
  bool valid = 1;
  repeated ValidationFinding errors   = 2;
  repeated ValidationFinding warnings = 3;
}

message ValidationFinding {
  // class is a stable, snake_case discriminator (e.g.
  // "missing_required_data_field"); operator tooling routes on this.
  string class   = 1;
  string message = 2;
  // path is a JSON-pointer-shaped breadcrumb into the request context
  // (e.g. "/executor/attributes/some_field").
  string path    = 3;
}
