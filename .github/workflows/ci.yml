name: ci

# PR-gating CI for the public repo. Runs on every pull request and on pushes to
# main. Two independent jobs: the Go build+test matrix across the workspace
# modules, and golangci-lint across those modules. The Go job runs on a
# Docker-enabled ubuntu runner so the testcontainers-backed scenario/storage
# tests (which require a working Docker socket) actually execute instead of
# being silently skipped.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build + test the four Go modules tied together by go.work.
  # Sharded as a matrix over the per-module Makefile targets so each module's
  # test slice runs in parallel on its own runner — wall-clock is bounded by
  # the slowest single module rather than the sum across all four.
  #
  # ubuntu-latest ships a running Docker daemon, so the testcontainers-backed
  # scenario/storage tests can spin up Postgres etc. The `services` shard is
  # the only one that additionally needs the locally-built rimsky images that
  # the lib/services/test/... integration harness consumes via testcontainers;
  # it builds them under this run's own tag (see the step below). The other
  # shards skip that image build to keep their critical path short.
  go:
    runs-on: ubuntu-latest
    env:
      # The root module's test/plumbline slice shells the vendored Plumbline
      # lint binary and self-skips when it cannot resolve one. Point it at the
      # copy committed under .ok-plumbline/bin so comment-hygiene and
      # citation-resolution violations fail CI instead of passing unchecked.
      PLUMBLINE_BIN: ${{ github.workspace }}/.ok-plumbline/bin/plumbline
    strategy:
      fail-fast: false
      matrix:
        module: [root, foundation, protocols, services]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track the pin in go.mod (currently 1.25.0) so CI never drifts from
          # the module's declared toolchain.
          go-version-file: go.mod
          cache: false
      - name: Build the images the services suites verify, under this run's tag
        if: matrix.module == 'services'
        # Per-run artifacts: this shard mints one tag, builds every image the
        # lib/services/test/... suites consume under that tag, and exports it
        # as RIMSKY_IMAGE_TAG for the test step. The harness resolves images
        # by that variable alone — no :latest, no fallback — so a suite can
        # only ever find an image this run built, and a missing one fails
        # loudly naming the variable and the build command.
        #
        # The image set is the whole one, not a hand-picked subset: the
        # scenarios boot sensors, executors, subscribers, claim producers and
        # the test-only stubs, and the make targets are the single definition
        # of how each is built. `core-images` passes the base-image argument
        # (RIMSKY_BASE) at this run's tag, because `rimsky-all-in-one` builds
        # FROM the rimsky image and must read the one this run just built.
        run: |
          tag="$(.ok-workspaces/bin/run-tag)"
          echo "RIMSKY_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          RIMSKY_IMAGE_TAG="$tag" make core-images service-images test-images
      - name: Test ${{ matrix.module }}
        run: make test-${{ matrix.module }}

  lint:
    runs-on: ubuntu-latest
    env:
      # Pin golangci-lint to a v1 release: this repo's .golangci.yml is a
      # v1-style config (top-level `issues:` / `linters-settings:`, no
      # `version:` field), which golangci-lint v2 — what `@latest` now
      # resolves to — rejects outright. Matches the developers' local v1.64.x.
      GOLANGCI_LINT_VERSION: v1.64.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install golangci-lint
        # Official install script, pinned to the v1 tag above, dropping the
        # binary on PATH so the Makefile's multi-module `make lint` (which
        # shells `golangci-lint run` per module) drives the actual linting.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint all modules
        run: make lint
