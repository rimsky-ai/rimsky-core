# Operator config bundle for the docker-compose reference stack. Loaded
# by rimsky-scheduler / rimsky-supervisor / rimsky-control-api at
# startup via RIMSKY_STORES_CONFIG.
#
# Per v3 spec §6.1 the schema collapses to a thin name → endpoint +
# declared-capabilities form. Substrate-specific keys (kind, connection,
# pick_policies, etc.) live in each store-service's own config and
# rimsky never sees them.
#
# Reference stack ships:
#   - content       : filesystem direct-mode store-service.
#   - topics-ring   : postgres store-service hosting the @review-queue
#                     pick policy. Name matches the smoke fixture
#                     (test/smoke/fixtures/template.yml) so docker-
#                     compose runs and in-process smoke runs declare the
#                     same lock surface.
#   - topics-ring:concurrent-claims: counting-semaphore (limit 5)
#                                    paired with the topics-ring store.
#   - model-budget: counting-semaphore (limit 50) for model-call
#                   throttling.

stores:
  content:
    endpoint: "grpc://store-filesystem:9100"
    capabilities:
      write_semantics: direct
  topics-ring:
    endpoint: "grpc://store-postgres:9101"
    capabilities:
      write_semantics: direct

named_locks:
  "topics-ring:concurrent-claims": { limit: 5 }
  model-budget:                    { limit: 50 }
