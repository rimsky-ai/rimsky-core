apiVersion: v1
kind: Service
metadata:
  name: {{ include "rimsky.fullname" . }}-sensor-cron
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor-cron
spec:
  type: ClusterIP
  selector:
    {{- include "rimsky.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sensor-cron
  ports:
    - name: grpc
      port: 9081
      targetPort: grpc
