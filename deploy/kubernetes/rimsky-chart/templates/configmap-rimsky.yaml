apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rimsky.fullname" . }}-rimsky-config
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
data:
  rimsky.yml: |
{{- if .Values.rimsky.config }}
{{ .Values.rimsky.config | indent 4 }}
{{- else }}
    # Mirrors deploy/rimsky.yml from the reference compose stack. Per
    # docs/specs/2026-05-04-modeling-layer-contract.md §10 (Option II
    # YAML): claim_producers + named_locks + executors in a single config,
    # each peer carrying a `protocols:` list and (for claim_producers) a
    # `write_semantics_envelope:` set. Override by setting `rimsky.config`
    # in values.yaml to a literal YAML body.
    claim_producers:
      - name: content
        endpoint: "grpc://{{ include "rimsky.fullname" . }}-store-filesystem:9100"
        protocols: [claim_producer]
        write_semantics_envelope: [sync]
      - name: topics-ring
        endpoint: "grpc://{{ include "rimsky.fullname" . }}-store-postgres:9101"
        protocols: [claim_producer]
        write_semantics_envelope: [sync]
    named_locks:
      - name: "topics-ring:concurrent-claims"
        mode: counting
        capacity: 5
      - name: model-budget
        mode: counting
        capacity: 50
    executors:
      - name: claude-agent
        endpoint: "grpc://{{ include "rimsky.fullname" . }}-claude-agent:9090"
        protocols: [executor]
      - name: http-node
        endpoint: "grpc://{{ include "rimsky.fullname" . }}-http-node:9091"
        protocols: [executor]
{{- end }}
