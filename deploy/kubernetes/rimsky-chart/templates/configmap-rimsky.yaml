apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rimsky.fullname" . }}-rimsky-config
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
data:
  rimsky.yml: |
{{- if .Values.rimsky.config }}
{{ .Values.rimsky.config | indent 4 }}
{{- else }}
    # Mirrors deploy/rimsky.yml from the reference compose stack. Per
    # docs/specs/2026-05-01-control-plane-and-store-lifecycle-design.md
    # §3.1: stores + named_locks + executors in a single config.
    # Override by setting `rimsky.config` in values.yaml to a literal
    # YAML body.
    stores:
      content:
        endpoint: "grpc://{{ include "rimsky.fullname" . }}-store-filesystem:9100"
        capabilities:
          write_semantics: direct
      topics-ring:
        endpoint: "grpc://{{ include "rimsky.fullname" . }}-store-postgres:9101"
        capabilities:
          write_semantics: direct
    named_locks:
      "topics-ring:concurrent-claims": { limit: 5 }
      model-budget:                    { limit: 50 }
    executors:
      claude-agent:
        transport: grpc
        endpoint: "{{ include "rimsky.fullname" . }}-claude-agent:9090"
        tls: off
      http-node:
        transport: grpc
        endpoint: "{{ include "rimsky.fullname" . }}-http-node:9091"
        tls: off
{{- end }}
