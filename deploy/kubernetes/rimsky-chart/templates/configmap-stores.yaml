apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rimsky.fullname" . }}-stores-config
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
data:
  stores.yml: |
{{- if .Values.stores.config }}
{{ .Values.stores.config | indent 4 }}
{{- else }}
    # Mirrors deploy/stores.yml from the reference compose stack. Override
    # by setting `stores.config` in values.yaml to a literal YAML body.
    stores:
      content:
        kind: filesystem
        mode: direct
        root: /workspace/content
      topics-ring:
        kind: claim_store
        backend: postgres
        items_table: topics_items
        on_commit_default: release_to_back
        on_give_up_default: release_to_back
        visibility_timeout_seconds: 300
{{- end }}
