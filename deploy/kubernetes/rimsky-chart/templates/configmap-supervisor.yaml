apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rimsky.fullname" . }}-supervisor-config
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
data:
  supervisor-config.yml: |
    postgres_url: "${RIMSKY_DB_URL}"
    concurrency: {{ .Values.supervisor.concurrency }}
    heartbeat_interval_ms: {{ .Values.supervisor.heartbeatIntervalMs }}
    claim_poll_interval_ms: 1000
    callback:
      host: 0.0.0.0
      port: 9100
      advertise_host: ${RIMSKY_SUPERVISOR_CALLBACK_ADVERTISE_HOST:-}
    executors:
      claude-agent:
        transport: grpc
        endpoint: "{{ include "rimsky.fullname" . }}-claude-agent:{{ .Values.claudeAgent.service.port }}"
        tls: off
      http-node:
        transport: grpc
        endpoint: "{{ include "rimsky.fullname" . }}-http-node:{{ .Values.httpNode.service.port }}"
        tls: off
