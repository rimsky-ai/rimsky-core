apiVersion: v1
kind: Service
metadata:
  name: {{ include "rimsky.fullname" . }}-claude-agent
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
    app.kubernetes.io/component: claude-agent
spec:
  type: {{ .Values.claudeAgent.service.type }}
  selector:
    {{- include "rimsky.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: claude-agent
  ports:
    - name: grpc
      port: {{ .Values.claudeAgent.service.port }}
      targetPort: {{ .Values.claudeAgent.service.port }}
