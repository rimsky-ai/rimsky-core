apiVersion: v1
kind: Service
metadata:
  name: {{ include "rimsky.fullname" . }}-control-api
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  type: {{ .Values.controlapi.service.type }}
  selector:
    {{- include "rimsky.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
  ports:
    - name: http
      port: {{ .Values.controlapi.service.port }}
      targetPort: {{ .Values.controlapi.service.port }}
{{- if .Values.controlapi.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rimsky.fullname" . }}-control-api
  labels:
    {{- include "rimsky.labels" . | nindent 4 }}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rimsky.fullname" . }}-control-api
                port:
                  number: {{ .Values.controlapi.service.port }}
{{- end }}
