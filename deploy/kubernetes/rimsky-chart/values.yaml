image:
  repository: rimsky
  tag: "0.1"
  pullPolicy: IfNotPresent

# Bundled services (stores, sensors, subscribers, production-side executors)
# live in the separate ../rimsky-services repo per spec
# .ok-planner/specs/2026-05-24-repo-reorganization-design.md phase P3.
# Their images are published independently; default repo is the
# ghcr namespace.
bundledServicesImage:
  repository: ghcr.io/fallguyconsulting/rimsky-services
  tag: latest
  pullPolicy: IfNotPresent

postgres:
  dsn: ""                      # required; consumer supplies

# rimsky.config — optional literal YAML body for the unified rimsky.yml
# ConfigMap (stores + named_locks + executors per docs/specs/2026-05-01-
# control-plane-and-store-lifecycle-design.md §3.1). When empty, the
# ConfigMap renders the reference values from `deploy/rimsky.yml`. The
# operator-owned `topics_items` table is NOT created by the chart —
# provision it out-of-band per spec §9.10 before installing.
rimsky:
  config: ""

scheduler:
  replicas: 1
  tickIntervalMs: 1500
  heartbeatTimeoutMs: 15000

supervisor:
  replicas: 2
  concurrency: 8
  heartbeatIntervalMs: 5000
  # callbackAdvertiseHost is the peer-reachable hostname executors dial back
  # to. Defaults to the supervisor Service DNS name; override if the chart
  # is deployed under a non-default release name.
  callbackAdvertiseHost: ""

controlapi:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false

httpNode:
  replicas: 2
  service:
    type: ClusterIP
    port: 9091
    httpPort: 9092

claudeAgent:
  replicas: 1
  stubMode: "1"                # "0" for real API
  anthropicApiKey: ""          # from secret
  service:
    type: ClusterIP
    port: 9090
    httpPort: 9190

# rimskyEndpoint is the control-api URL bundled sensors dial when
# POSTing message envelopes. Defaults to the in-cluster control-api
# Service DNS name; override when the chart deploys sensors against a
# rimsky cluster elsewhere.
rimskyEndpoint: ""

# Bundled sensors (Publisher protocol). Per concept:replica the v1
# contract is single-replica per sensor binary.
sensorCron:
  replicas: 1
  imageTag: ""   # defaults to image.tag
  stateDSN: ""   # empty → in-memory mode (subscriptions rebuild via rimsky ResyncPublisherSubscriptions at supervisor startup)
sensorHttp:
  replicas: 1
  imageTag: ""
  stateDSN: ""   # empty → in-memory mode; body-hash watermarks reset on restart
sensorObjectStore:
  replicas: 1
  imageTag: ""
  stateDSN: ""   # empty → in-memory mode; watermark cursors reset on restart
sensorWebhook:
  replicas: 1
  imageTag: ""
  stateDSN: ""   # empty → in-memory mode; idempotency-key state resets on restart

resources: {}
