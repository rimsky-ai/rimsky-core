image:
  repository: rimsky
  tag: "0.1"
  pullPolicy: IfNotPresent

postgres:
  dsn: ""                      # required; consumer supplies

# stores.config — optional literal YAML body for the stores ConfigMap. When
# empty, the ConfigMap renders the reference stores from `deploy/stores.yml`
# (filesystem `content` rooted at /workspace/content + postgres `topics-ring`
# claim store over `topics_items`). The operator-owned `topics_items` table
# is NOT created by the chart — provision it out-of-band per spec §9.10
# before installing.
stores:
  config: ""

scheduler:
  replicas: 1
  tickIntervalMs: 1500
  heartbeatTimeoutMs: 15000

supervisor:
  replicas: 2
  concurrency: 8
  heartbeatIntervalMs: 5000
  # callbackAdvertiseHost is the peer-reachable hostname executors dial back
  # to. Defaults to the supervisor Service DNS name; override if the chart
  # is deployed under a non-default release name.
  callbackAdvertiseHost: ""

controlapi:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false

httpNode:
  replicas: 2
  service:
    type: ClusterIP
    port: 9091
    httpPort: 9092

claudeAgent:
  replicas: 1
  stubMode: "1"                # "0" for real API
  anthropicApiKey: ""          # from secret
  service:
    type: ClusterIP
    port: 9090
    httpPort: 9190

resources: {}
