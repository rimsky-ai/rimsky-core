# Quickstart rimsky.yml — wires rimsky/all to the bundled stub
# claim-producer and stub executor over the compose network.
#
# Persistence is postgres because the unified image runs three rimsky
# processes (scheduler + supervisor + control-api) concurrently against
# one persistence backend. SQLite's writer-lock model produces frequent
# SQLITE_BUSY errors under that contention even with WAL mode; postgres
# handles concurrent transactions properly. The docker-compose.yml in
# this directory provides the postgres container.

persistence:
  driver: postgres
  postgres:
    dsn: "postgres://rimsky:rimsky@postgres:5432/rimsky?sslmode=disable"

# Single bundled stub claim-producer. The "stub" name is what node
# declarations reference in their `stores:` block.
claim_producers:
  stub:
    endpoint: "grpc://store-stub:9102"
    protocols: [claim_producer]
    write_semantics_envelope: [sync]

# A single named lock for examples that want to demonstrate
# capacity-bounded coordination.
named_locks:
  example-mutex: { limit: 1 }

# Single bundled stub executor. Always returns Complete with
# `changed: true` and a small attributes_delta keyed on node_type.
executors:
  stub:
    transport: grpc
    endpoint: "executor-stub:9300"
    tls: off
    protocols: [executor]
