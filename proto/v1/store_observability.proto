syntax = "proto3";

package rimsky.v1;

option go_package = "github.com/fallguy/rimsky/proto/v1/gen;genv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "executor_observability.proto";

// StoreObservability is the optional read-only protocol every store MAY
// implement to expose per-claim views (state, history, store-chosen
// payload/address/region disclosure) plus optional admin views to
// dashboards. The dispatch protocol (store_service.proto) is unchanged.
// See docs/specs/2026-05-02-dashboard-and-observability-design.md §3.
service StoreObservability {
  rpc GetCapabilities(GetStoreCapabilitiesRequest) returns (StoreObservabilityCapabilities);
  rpc GetClaim(GetClaimRequest) returns (ClaimDetail);
  rpc StreamClaim(StreamClaimRequest) returns (stream ClaimEvent);
  rpc ListClaims(ListClaimsRequest) returns (ClaimList);
  rpc GetAdminView(GetAdminViewRequest) returns (AdminView);
}

message GetStoreCapabilitiesRequest {}

message StoreObservabilityCapabilities {
  bool supports_claim_get = 1;
  bool supports_claim_stream = 2;
  bool supports_list_claims = 3;
  uint64 retention_after_terminal_seconds = 4;
  CustomUI custom_ui = 5;
  repeated AdminViewDecl admin_views = 6;
  // http_bridge_url, when non-empty, is the absolute base URL the peer
  // serves the HTTP+JSON observability bridge on. Dashboard clients
  // dial this URL directly for browser-friendly fetch/SSE access. When
  // empty, peers expose only the gRPC surface.
  string http_bridge_url = 7;
}

message AdminViewDecl {
  string name = 1;
  string title = 2;
  string description = 3;
  repeated AdminViewParam params = 4;
}

message AdminViewParam {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
}

message GetClaimRequest {
  string claim_id = 1;
}

message StreamClaimRequest {
  string claim_id = 1;
}

message ClaimDetail {
  string claim_id = 1;
  ClaimState state = 2;
  google.protobuf.Struct address = 3;
  google.protobuf.Struct payload = 4;
  google.protobuf.Struct region = 5;
  google.protobuf.Timestamp opened_at = 6;
  google.protobuf.Timestamp closed_at = 7;
  repeated ClaimEvent history = 8;
}

enum ClaimState {
  CLAIM_STATE_UNSPECIFIED = 0;
  OPEN = 1;
  COMMITTED = 2;
  ABANDONED = 3;
  RELEASED = 4;
  UNKNOWN = 5;
}

message ClaimEvent {
  string event_id = 1;
  string parent_event_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  Severity severity = 4;
  string category = 5;
  string message = 6;
  google.protobuf.Struct attributes = 7;
}

message ListClaimsRequest {
  string state_filter = 1;
  string cursor = 2;
  uint32 limit = 3;
}

message ClaimList {
  repeated ClaimSummary claims = 1;
  string next_cursor = 2;
}

message ClaimSummary {
  string claim_id = 1;
  ClaimState state = 2;
  google.protobuf.Timestamp opened_at = 3;
  google.protobuf.Timestamp closed_at = 4;
}

message GetAdminViewRequest {
  string view_name = 1;
  google.protobuf.Struct params = 2;
}

message AdminView {
  AdminViewSchema schema = 1;
  google.protobuf.Struct data = 2;
  string render_hint = 3;
}

message AdminViewSchema {
  repeated AdminViewColumn columns = 1;
}

message AdminViewColumn {
  string name = 1;
  string type = 2;
}
