syntax = "proto3";
package rimsky.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/fallguy/rimsky/proto/v1/gen;genv1";

// NodeExecutor is the protocol rimsky supervisors use to dispatch work to
// external executors. See docs/specs/2026-04-25-stores-redesign-design.md §12
// for the full contract (transports, async handoff, attributes, stores,
// versioning, auth).
service NodeExecutor {
  // Execute is called by the rimsky supervisor when dispatching a node. The
  // response stream carries zero or more Heartbeat events followed by EXACTLY
  // ONE terminal event (Complete | Blocked | Errored | AsyncAccepted); the
  // executor MUST close the stream immediately after the terminal event.
  // Stream close without a terminal event is treated by the supervisor as an
  // infrastructure error.
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
}

// ExecuteRequest carries the full context of a node dispatch. Only `userdata`
// is opaque to rimsky — the rest is rimsky-populated. See spec §12.1.
message ExecuteRequest {
  string node_id = 1;
  string instance_id = 2;
  string node_type = 3;

  // Opaque per-node config from the template. Rimsky never interprets this;
  // only the executor does. NEVER substituted.
  google.protobuf.Struct userdata = 4;

  // Per-run typed attributes. Source-directive fields are pre-populated by
  // rimsky at dispatch; sourceless fields are populated by the executor
  // (terminal-final via attributes_delta on Complete, or incremental via
  // POST {callback_url}/v1/attributes/{node_id}).
  google.protobuf.Struct attributes = 5;

  // The declared JSON Schema for the node's attributes. For executor reference;
  // rimsky validates at dispatch (substitution) and at commit (writeback)
  // regardless.
  google.protobuf.Struct attributes_schema = 6;

  // Handles for each store the node references. Keyed by store-config name.
  map<string, StoreHandle> stores = 7;

  // HTTP+JSON callback URL the executor may POST to for async handoff and
  // incremental attribute writes. Populated by the supervisor; empty string
  // if the supervisor did not configure a callback endpoint.
  string callback_url = 8;

  // Token the supervisor watches for cancellation requests, also used as the
  // bearer token on incremental attribute and async terminal callbacks.
  string cancel_token = 9;

  // True iff the dispatch is a resumed retry (resumable: true +
  // resume_then_retry). The executor may use this to short-circuit re-running
  // already-completed work.
  bool resumed = 10;

  // Increments on every retry. Exposed for executor visibility / idempotency.
  int32 run_attempt = 11;
}

// StoreHandle is the per-store reference handed to the executor at dispatch.
// `kind` selects the handle shape; `handle` is the kind-specific payload.
message StoreHandle {
  // "filesystem" | "claim_store" (and future kinds).
  string kind = 1;
  // Kind-specific handle payload (e.g. paths for filesystem, claim id +
  // payload for claim_store).
  google.protobuf.Struct handle = 2;
  // Region intents the supervisor pre-acquired write-locks for.
  repeated string write_regions = 3;
  // Region intents the supervisor pre-acquired read-locks for.
  repeated string read_regions = 4;
  // True iff store-side prior work exists for this dispatch (e.g. a sidecar
  // tree from a previous resumable attempt).
  bool resumed = 5;
}

message ExecuteEvent {
  oneof event {
    Heartbeat heartbeat = 1;
    Complete complete = 2;
    Blocked blocked = 3;
    Errored errored = 4;
    AsyncAccepted async_accepted = 5;  // terminal; see spec §12.4 async handoff
  }
}

// Heartbeat is a non-terminal progress indicator. Executors may emit any
// number of these during a long-running execution; supervisors refresh the
// node's last_heartbeat_at on receipt.
message Heartbeat {
  int64 timestamp_ms = 1;
  string note = 2;
}

// Complete is a terminal event reporting successful execution with a
// producer-declared `changed` verdict. Optional `attributes_delta` carries
// terminal-final attribute writeback; empty for the incremental-via-callback
// pattern (see spec §12.5).
message Complete {
  bool changed = 1;
  string change_summary = 2;
  // Optional terminal-final attribute writeback. Replaces the old `result`
  // field. Empty when the executor used the incremental callback path.
  google.protobuf.Struct attributes_delta = 3;
}

// Blocked is a terminal event reporting that the executor cannot progress
// without external intervention. Mapped by the supervisor to error class
// "executor_blocked" unless the cell template declared a matching error type.
message Blocked {
  string reason = 1;
  google.protobuf.Struct context = 2;
}

// Errored is a terminal event reporting an application-level error. The
// supervisor routes to on_error(error_class, payload) via the policy chain.
message Errored {
  string error_class = 1;
  google.protobuf.Struct payload = 2;
}

// AsyncAccepted is a terminal event signaling that the executor has accepted
// the work but will report the final outcome later via HTTP+JSON POST to
// ExecuteRequest.callback_url. The supervisor holds the dispatch row claim
// and keeps the node in running state until the callback arrives (subject to
// heartbeat-loss sweep). See spec §12.4 async handoff path.
message AsyncAccepted {
  // Echoed back by the executor on the callback so the supervisor can
  // correlate.
  string async_ack_id = 1;
  // Optional hint; the supervisor still uses its own heartbeat-loss cutoff
  // for timeout enforcement.
  int64 expected_completion_ms = 2;
}
