// Store-service wire protocol.
//
// Per spec docs/specs/2026-04-27-stores-redesign-v3-design.md §4.1, §5.1
// (as amended by docs/specs/2026-04-30-stores-protocol-cleanup-design.md).
// Four runtime verbs (Open / Commit / Abandon / Release) plus one
// startup-handshake verb (Capabilities). HTTP+JSON bridge handlers (per
// spec §5.2) decode JSON to these messages and call the same internal
// handler the gRPC server uses.
//
// Field shapes:
//   - claim_id is a UUID textual form (string), generated client-side per
//     spec §4.2 before Open is called and threaded through every
//     subsequent verb for that claim's lifecycle.
//   - region, address, payload are opaque bytes (json.RawMessage on the
//     rimsky side; stores choose their own canonical encoding).
//   - selector, intent, alias, store_name are strings.
//
// Errors flow as gRPC status codes per spec §5.3.

syntax = "proto3";
package rimsky.v1;

option go_package = "github.com/fallguy/rimsky/proto/v1/gen;genv1";

// StoreService is the wire-form rimsky↔store contract. Every standard
// store-service binary implements this interface; rimsky's
// core/store/remote/ package implements the gRPC client.
service StoreService {
  // Capabilities is the startup-handshake verb. Called once per
  // store-service per rimsky process at startup; the result is cached
  // and validated against the operator's declared requirements. Not
  // called on the runtime path.
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);

  // Lifecycle events. Every store-service implements all six; stores that
  // don't care return success immediately. Per spec §4.1 / §5.
  rpc OnTemplateRegistered(OnTemplateRegisteredRequest)     returns (OnTemplateRegisteredResponse);
  rpc OnTemplateDeployed(OnTemplateDeployedRequest)         returns (OnTemplateDeployedResponse);
  rpc OnTemplateUndeployed(OnTemplateUndeployedRequest)     returns (OnTemplateUndeployedResponse);
  rpc OnTemplateDeregistered(OnTemplateDeregisteredRequest) returns (OnTemplateDeregisteredResponse);
  rpc OnInstanceCreated(OnInstanceCreatedRequest)           returns (OnInstanceCreatedResponse);
  rpc OnInstanceTerminated(OnInstanceTerminatedRequest)     returns (OnInstanceTerminatedResponse);

  // Open creates whatever store-internal state the (intent,
  // write_semantics) combination requires and returns the
  // store-supplied address the executor will use on the data path.
  // Called inside the rimsky-side acquisition transaction (per spec
  // §7.3 step 4); the store runs its own state mutation in its own
  // transaction.
  rpc Open(OpenRequest) returns (OpenResponse);

  // Commit signals that the consumer of the claim succeeded. The
  // store decides what to do with its own state (publish staging
  // into live, delete the items-table row, release-to-back, etc.) per
  // the store's own configuration. For direct rw, typically a
  // no-op.
  rpc Commit(CommitRequest) returns (CommitResponse);

  // Abandon signals that the consumer of the claim failed. The
  // store decides what to do with its own state per its own
  // configuration. Not called for read-only claims and not called by
  // the orphan reaper in v3 default behavior (per spec §7.5).
  rpc Abandon(AbandonRequest) returns (AbandonResponse);

  // Release tears down store-internal read state created at Open.
  // Fires only when the store registered such state at Open; for
  // direct stores, typically a no-op.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

// CapabilityStruct describes what the store-service supports.
// Single-field shape in v3; forward-compat for additional fields.
message CapabilityStruct {
  // write_semantics is one of "direct" | "staged_blocking" |
  // "staged_async". Operator-declared in rimsky.yml; rimsky validates
  // strict equality against this value at startup.
  string write_semantics = 1;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  CapabilityStruct capabilities = 1;
}

// OpenRequest carries the rimsky-generated claim_id plus the resolved
// claim spec. selector is post-substitution; the store parses it.
// template_id and instance_id form the per-spec §4.2 scope envelope:
// opaque to rimsky, populated from the dispatch row's instance →
// template lookup, available to the store-service for namespace
// routing or trace correlation.
message OpenRequest {
  string claim_id = 1;
  string store_name = 2;
  string selector = 3;
  string intent = 4;  // "r" | "rw"
  string alias = 5;   // template-side identifier; store ignores
  string template_id = 6;  // content hash; opaque to rimsky.
  string instance_id = 7;  // instance UUID; opaque to rimsky.
}

// OpenResponse signals acquisition outcome. Stores that always
// have a claim to give return Acquired. Stores that may have
// nothing right now (e.g. an empty items-table queue) return
// Unavailable; rimsky retries on the next scheduler tick. Store-
// side faults flow as gRPC error status codes, not as an Unavailable
// response.
message OpenResponse {
  oneof result {
    Acquired    acquired    = 1;
    Unavailable unavailable = 2;
  }
}

// Acquired carries the store's acquisition outputs. Address,
// payload, and region are opaque bytes per blessed invariant 20;
// any or all may be empty depending on the (write_semantics, intent)
// combination.
message Acquired {
  bytes address = 1;
  bytes payload = 2;
  bytes region  = 3;
}

// Unavailable signals "no claim available right now." No fields.
message Unavailable {}

message CommitRequest {
  string claim_id = 1;
  bytes  region   = 2;
  bytes  address  = 3;
}

message CommitResponse {}

message AbandonRequest {
  string claim_id = 1;
  bytes  region   = 2;
  bytes  address  = 3;  // may be empty; store identifies state by claim_id
}

message AbandonResponse {}

message ReleaseRequest {
  string claim_id = 1;
  bytes  region   = 2;
  bytes  address  = 3;
}

message ReleaseResponse {}

// Template-scope lifecycle events. template_id is the content hash
// ("sha256-<64-hex>"), opaque to rimsky.
message OnTemplateRegisteredRequest    { string template_id = 1; }
message OnTemplateRegisteredResponse   {}
message OnTemplateDeployedRequest      { string template_id = 1; }
message OnTemplateDeployedResponse     {}
message OnTemplateUndeployedRequest    { string template_id = 1; }
message OnTemplateUndeployedResponse   {}
message OnTemplateDeregisteredRequest  { string template_id = 1; }
message OnTemplateDeregisteredResponse {}

// Instance-scope lifecycle events. instance_id is the rimsky-generated
// instance UUID, opaque to rimsky.
message OnInstanceCreatedRequest {
  string template_id = 1;
  string instance_id = 2;
}
message OnInstanceCreatedResponse {}
message OnInstanceTerminatedRequest {
  string template_id = 1;
  string instance_id = 2;
}
message OnInstanceTerminatedResponse {}
