syntax = "proto3";

package rimsky.v1;

option go_package = "github.com/rimsky-ai/rimsky-core/lib/protocols/proto/v1/gen;genv1";

service ClaimProducer {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);

  rpc Open(OpenRequest) returns (OpenResponse);

  rpc Commit(CommitRequest) returns (CommitResponse);

  rpc Abandon(AbandonRequest) returns (AbandonResponse);

  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  rpc SplitScope(SplitScopeRequest) returns (SplitScopeResponse);

  rpc ScopesConflict(ClaimScopesConflictRequest) returns (ScopesConflictResponse);
}

enum WriteSemantics {
  WRITE_SEMANTICS_UNKNOWN = 0;
  WRITE_SEMANTICS_SYNC = 1;
  WRITE_SEMANTICS_STAGED_ASYNC = 2;
  WRITE_SEMANTICS_BLOCKING_ASYNC = 3;
  WRITE_SEMANTICS_READ_ONLY = 4;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  repeated WriteSemantics write_semantics_allowed = 1;
  bool supports_split_scope = 2;
  bool supports_scopes_conflict = 3;
  repeated string protocols = 4;
  repeated string validation_supported_roles = 5;

  repeated string declared_error_classes = 6;
}

message OpenRequest {
  string claim_id = 1;
  string producer_name = 2;
  string selector = 3;
  string intent = 4;
  string alias = 5;
  string template_id = 6;
  string instance_id = 7;
  string run_scope_id = 8;
  string lifetime = 9;
}

message OpenResponse {
  oneof result {
    Acquired    acquired    = 1;
    Unavailable unavailable = 2;
  }
}

message Acquired {
  bytes address = 1;
  bytes payload = 2;
  bytes claim_scope = 3;
  WriteSemantics realized_write_semantics = 4;
}

message Unavailable {
  string error_class = 1;
}

message CommitRequest {
  string claim_id = 1;
  bytes  claim_scope = 2;
  bytes  address  = 3;
  string lease_token = 4;
}

message CommitResponse {
  string version_id = 1;
  bytes producer_metadata = 2;
}

message AbandonRequest {
  string claim_id = 1;
  bytes  claim_scope = 2;
  bytes  address  = 3;
  string lease_token = 4;
}

message AbandonResponse {}

message ReleaseRequest {
  string claim_id = 1;
  bytes  claim_scope = 2;
  bytes  address  = 3;
  string lease_token = 4;
}

message ReleaseResponse {}

message SplitScopeRequest {
  string claim_handle_id  = 1;
  bytes  partition_request = 2;
}

message SubScopeDescriptor {
  bytes  claim_scope_data  = 1;
  string partition_key    = 2;
  bytes  producer_metadata = 3;
  bytes  address           = 4;
  bytes  payload           = 5;
  string lease_token       = 6;
}

message SplitScopeResponse {
  repeated SubScopeDescriptor sub_scopes = 1;
}

message ClaimScopesConflictRequest {
  bytes claim_scope_a = 1;
  bytes claim_scope_b = 2;
}

message ScopesConflictResponse {
  bool conflicts = 1;
}
