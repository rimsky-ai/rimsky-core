// LifecycleSubscriber wire protocol.
//
// Per spec docs/specs/2026-05-04-service-protocol-contract.md §3
// (extracted from claim_producer.proto under the layer-crystallization
// plan, Phase 4). Implementer pattern: return success from any method
// the binary doesn't react to. Binaries that don't react to any event
// simply don't implement the service.
//
// Idempotency: rimsky tracks per-peer idempotency in the
// rimsky_lifecycle_idempotencies table; subscribers can assume each
// (peer, event) pair fires exactly once on the rimsky side. Subscribers
// SHOULD also be idempotent against duplicate calls in case of network
// retries.

syntax = "proto3";

package rimsky.v1;

option go_package = "github.com/rimsky-ai/rimsky-core/lib/protocols/proto/v1/gen;genv1";

service LifecycleSubscriber {
  rpc OnTemplateRegistered(OnTemplateRegisteredRequest) returns (LifecycleAck);
  rpc OnTemplateDeployed(OnTemplateDeployedRequest) returns (LifecycleAck);
  rpc OnTemplateUndeployed(OnTemplateUndeployedRequest) returns (LifecycleAck);
  rpc OnTemplateDeregistered(OnTemplateDeregisteredRequest) returns (LifecycleAck);
  rpc OnInstanceCreated(OnInstanceCreatedRequest) returns (LifecycleAck);
  rpc OnInstanceTerminated(OnInstanceTerminatedRequest) returns (LifecycleAck);
  // OnRunScopeTerminal fires when a run-scope reaches terminal state.
  // Fired from the rimsky-side process that owns the state transition:
  // control-api for main scopes (polling-driven via instance_terminator.tick);
  // the supervisor for sub-graph and fanout-partition scopes (synchronous,
  // in-tx). DB-tracked idempotency via rimsky_lifecycle_idempotencies
  // (scope_kind="run_scope", state="run_scope_terminal") is preserved across
  // both firing sites.
  rpc OnRunScopeTerminal(OnRunScopeTerminalRequest) returns (LifecycleAck);
}

message OnTemplateRegisteredRequest {
  string template_hash = 1;
  bytes spec = 2;  // canonical JCS-canonicalized template spec (may be empty)
}

message OnTemplateDeployedRequest {
  string template_hash = 1;
  repeated string tags = 2;
}

message OnTemplateUndeployedRequest {
  string template_hash = 1;
}

message OnTemplateDeregisteredRequest {
  string template_hash = 1;
}

message OnInstanceCreatedRequest {
  string instance_id = 1;
  string template_hash = 2;
  string instance_key = 3;  // may be empty
  bytes params = 4;

  // service_bindings carries the per-instance late-bound service catalog
  // (opaque JSONB bytes). Empty when the instance has no late-bound services.
  // Consumed by the host-agent-proxy to populate its binding cache.
  bytes service_bindings = 5;

  // owner_api_key_id is the api-key whose authenticated request created the
  // instance (empty string for anonymous-mode-created instances). Consumed
  // by the host-agent-proxy to route dispatches to the right user's agent.
  string owner_api_key_id = 6;
}

message OnInstanceTerminatedRequest {
  string instance_id = 1;
  string template_hash = 2;
  int64 terminated_at_unix_ms = 3;
}

message OnRunScopeTerminalRequest {
  string run_scope_id    = 1;
  string terminal_reason = 2;
  // instance_id is the owning instance of the terminating run-scope.
  // Populated at every firing site (control-api for main scopes; the
  // supervisor for sub-graph and fanout-partition scopes). The
  // host-agent-proxy keys lazily-spawned children by instance id (its v1
  // dispatch-observable scope), so the reap path matches on instance_id
  // rather than run_scope_id. Empty only for legacy callers that predate
  // this field.
  string instance_id    = 3;
}

message LifecycleAck {
  // empty; reserved for future use
}
