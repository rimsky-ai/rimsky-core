syntax = "proto3";

package rimsky.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rimsky-ai/rimsky-core/lib/protocols/proto/v1/gen;genv1";

// OperationalKind enumerates the canonical set of operational event-log
// kind discriminators rimsky emits today. Signal-class kinds (the
// `terminal/...`, `transient/...`, `attribute/...`, `event/...`,
// `message/...` taxonomy validated at template registration) are NOT
// listed here — those carry the parsed signal type-path as the kind
// value and live in the signal taxonomy.
//
// See decision:event-log-kind-enum: rimsky's app logic consumes typed
// values exclusively (this enum for operational kinds; the parsed
// signal type-path for signal-class kinds), never raw strings. The
// persistence layer marshals typed → string at write and string →
// typed at read; an unknown string at the unmarshal boundary is a
// defensive error.
//
// Adding a new operational kind = adding a value here and regenerating
// Go bindings (no schema migration; the storage column stays TEXT).
enum OperationalKind {
  OPERATIONAL_KIND_UNSPECIFIED = 0;
  // auth.* — auth-audit slice surfaced by GET /audit.
  OPERATIONAL_KIND_AUTH_ACCESS_ATTEMPTED = 1;
  OPERATIONAL_KIND_AUTH_ACCESS_DENIED = 2;
  OPERATIONAL_KIND_AUTH_KEY_CREATED = 3;
  OPERATIONAL_KIND_AUTH_KEY_REVOKED = 4;
  OPERATIONAL_KIND_AUTH_KEY_ROTATED = 5;
  // Node-run lifecycle and supervisor decisions.
  OPERATIONAL_KIND_STATE_TRANSITION = 10;
  OPERATIONAL_KIND_WORK_STARTED = 11;
  OPERATIONAL_KIND_WORK_COMPLETED = 12;
  OPERATIONAL_KIND_WORK_REJECTED = 13;
  // 14 was OPERATIONAL_KIND_HEARTBEAT_LOST, retired by the
  // executor-protocol-coherence reshape (orphan detection now keys on
  // last_progress_at + RPC connection state).
  reserved 14;
  reserved "OPERATIONAL_KIND_HEARTBEAT_LOST";
  OPERATIONAL_KIND_NO_OP_COMMIT = 15;
  OPERATIONAL_KIND_OPERATOR_OVERRIDE = 16;
  OPERATIONAL_KIND_UNRESOLVED_EXECUTOR = 17;
  OPERATIONAL_KIND_INSTANCE_TERMINATED = 18;
  OPERATIONAL_KIND_ERROR = 19;
  // Lock-holder lifecycle.
  OPERATIONAL_KIND_LOCK_ACQUIRED = 20;
  OPERATIONAL_KIND_LOCK_RELEASED = 21;
  OPERATIONAL_KIND_LOCK_ORPHAN_REAPED = 22;
  // Claim lifecycle.
  OPERATIONAL_KIND_CLAIM_ACQUIRED = 30;
  OPERATIONAL_KIND_CLAIM_HELD = 31;
  OPERATIONAL_KIND_CLAIM_RESOLVED = 32;
  OPERATIONAL_KIND_ORPHANED_CLAIM_RELEASED = 33;
  OPERATIONAL_KIND_ORPHANED_CLAIM_LOST_RACE = 34;
  OPERATIONAL_KIND_CLAIM_RESOLUTION_COMMIT = 35;
  OPERATIONAL_KIND_CLAIM_RESOLUTION_ABANDON = 36;
  // Attribute-substitution + validation.
  OPERATIONAL_KIND_ATTRIBUTES_SUBSTITUTED = 40;
  OPERATIONAL_KIND_ATTRIBUTES_COMMITTED = 41;
  OPERATIONAL_KIND_ATTRIBUTES_VALIDATION_FAILED = 42;
  OPERATIONAL_KIND_ATTRIBUTES_SCHEMA_FAILED = 43;
  OPERATIONAL_KIND_TEMPLATE_RESOLUTION_FAILED = 44;
  OPERATIONAL_KIND_TEMPLATE_VALIDATION_FAILED = 45;
  OPERATIONAL_KIND_EXECUTOR_SCHEMA_UNAVAILABLE = 46;
  // Breakpoint debugger.
  OPERATIONAL_KIND_BREAKPOINT_HIT = 50;
  // Message bus (operational-side audit of message activity, distinct
  // from the signal-class `message/...` topology).
  OPERATIONAL_KIND_MESSAGE_EMITTED = 60;
  OPERATIONAL_KIND_MESSAGE_RECEIVED = 61;
  // Fan-out + sub-claim + sub-graph dispatch.
  OPERATIONAL_KIND_FAN_OUT_DISPATCHED = 70;
  OPERATIONAL_KIND_FANOUT_CHILDREN_CREATED = 71;
  OPERATIONAL_KIND_SUBCLAIM_BEGIN_CANDIDATE = 72;
  OPERATIONAL_KIND_SUBCLAIM_ACQUIRED = 73;
  OPERATIONAL_KIND_SUBGRAPH_INTERNAL_CASCADE_FIRED = 74;
  OPERATIONAL_KIND_SUBGRAPH_DISPATCHED = 75;
  OPERATIONAL_KIND_SUBGRAPH_EXIT_CARRY = 76;
  // Parked-node lifecycle.
  OPERATIONAL_KIND_PARK_TIMEOUT = 80;
  OPERATIONAL_KIND_PARKED_RESUME_STARTED = 81;
  // Debug channel (POST /instances/{id}/debug/override). The audit
  // event for a successful operator override applied through the
  // gated debug channel, distinct from the legacy
  // OPERATIONAL_KIND_OPERATOR_OVERRIDE which records the surviving
  // node:reset operator action.
  OPERATIONAL_KIND_DEBUG_OVERRIDE_APPLIED = 82;
}

// Event is one row of the rimsky_events log with a typed payload. Consumers
// who want type-checked event streams may use this shape; rimsky's own
// internals use map[string]any + JSONB and do not marshal through this proto.
//
// See spec §9.8 of docs/history/2026-04-25-stores-redesign-design.md for the
// full event-kind catalogue. When new kinds are added to the log, they should
// be declared here.
//
// The wire `kind` field is `string` for backward compatibility on the wire
// (rimsky's typed-payload oneof is unchanged); the typed `OperationalKind`
// enum is what app logic consumes internally, with marshaling to/from the
// wire string happening at the persistence boundary. See
// decision:event-log-kind-enum.
message Event {
  int64 id = 1;
  string instance_id = 2;
  string node_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string kind = 5;
  // Reserved field numbers for removed payloads (per proto3 best-practice):
  //   16 = CommitPayload          (superseded by attributes_committed)
  //   18 = QualityRuleFailedPayload (retired by the 2026-05-15
  //                                  data-platform-extensions plan P1;
  //                                  verifier executors emit
  //                                  `executor_errored` with
  //                                  `error_class: "verifier_failed"`)
  //   19 = HeartbeatLostPayload   (retired by the executor-protocol-coherence
  //                                reshape; orphan detection keys on
  //                                last_progress_at + RPC connection state)
  //   24 = ScheduleFiredPayload         (retired by the 2026-05-15 plan
  //                                      B10 / D7 / E16 schedule cascade)
  //   26 = PureCascadeCommitPayload (commit semantics fold into attributes)
  //   27 = ScheduleDispatchFailedPayload (retired with the schedule cascade)
  reserved 16, 18, 19, 24, 26, 27;
  reserved "commit", "quality_rule_failed", "heartbeat_lost", "schedule_fired", "pure_cascade_commit", "schedule_dispatch_failed";
  // Reserved field numbers held vacant for future event-kind additions.
  // Keeping them reserved prevents accidental reuse if a payload is
  // removed from the 40+ block and a new one slots into 28/29 instead.
  reserved 28, 29;
  oneof payload {
    MessageEmittedPayload message_emitted = 10;
    MessageReceivedPayload message_received = 11;
    StateTransitionPayload state_transition = 12;
    ErrorPayload error = 13;
    WorkStartedPayload work_started = 14;
    WorkCompletedPayload work_completed = 15;
    NoOpCommitPayload no_op_commit = 17;
    OperatorOverridePayload operator_override = 20;
    OrphanedClaimReleasedPayload orphaned_claim_released = 21;
    OrphanedClaimLostRacePayload orphaned_claim_lost_race = 22;
    WorkRejectedPayload work_rejected = 23;
    UnresolvedExecutorPayload unresolved_executor = 25;

    // New event kinds added by the stores-redesign (spec §9.8). Numbers
    // start at 40 to skip past the existing top-level `payload_raw = 30`.
    // Field numbers 28 and 29 are held via the `reserved 28, 29;` line
    // above for future event-kind slots.
    LockAcquiredPayload lock_acquired = 40;
    LockReleasedPayload lock_released = 41;
    LockOrphanReapedPayload lock_orphan_reaped = 42;
    AttributesSubstitutedPayload attributes_substituted = 43;
    AttributesCommittedPayload attributes_committed = 44;
    AttributesValidationFailedPayload attributes_validation_failed = 45;
    ClaimAcquiredPayload claim_acquired = 46;
    ClaimHeldPayload claim_held = 47;
    ClaimResolvedPayload claim_resolved = 48;
    TemplateResolutionFailedPayload template_resolution_failed = 49;

    // Fallback: event kinds not yet declared here appear with raw JSON
    // payload in the common payload_raw field below.
  }
  // For event kinds not in the oneof above, the raw JSON payload is surfaced
  // here. Kept populated for all events as a convenience so consumers can
  // fall back to untyped reading.
  google.protobuf.Struct payload_raw = 30;
}

message MessageEmittedPayload {
  string type = 1;            // "invalidate" | "recalculate"
  string source_node_id = 2;
  string target_node_id = 3;
  google.protobuf.Struct params = 4;
}

message MessageReceivedPayload {
  string type = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  google.protobuf.Struct params = 4;
}

message StateTransitionPayload {
  string from = 1;
  string to = 2;
  string reason = 3;
}

message ErrorPayload {
  string error_class = 1;
  google.protobuf.Struct details = 2;
  string action_taken = 3;
  int64 delay_ms = 5;
}

message WorkStartedPayload {
  string supervisor_id = 1;
}

message WorkCompletedPayload {
  string outcome = 1;  // "committed" | "no_op" | "rejected" | "errored" | "infra_errored"
}

message NoOpCommitPayload {
  string reason = 1;
}

message OperatorOverridePayload {
  string action = 1;
  string actor = 2;
  string reason = 3;
  // Field 4 (`restore_version`) removed: per stores-redesign §9.8 / §11.3,
  // versioned-mode is post-v1 and `RestoreVersion` plumbing is dropped.
  reserved 4;
  reserved "restore_version";
}

message OrphanedClaimReleasedPayload {
  string dispatch_id = 1;
  string prior_claimed_by = 2;
  google.protobuf.Timestamp claimed_at = 3;
}

message OrphanedClaimLostRacePayload {
  string supervisor_id = 1;
  string dispatch_id = 2;
  string ownership_kind = 3;
  string current_claimed_by = 4;
  string winning_supervisor_id = 5;
}

message WorkRejectedPayload {
  string reason = 1;
  google.protobuf.Struct errors = 2;
}

message UnresolvedExecutorPayload {
  string node_id = 1;
  string executor_name = 2;
  string supervisor_id = 3;
}

// LockAcquiredPayload is emitted when a supervisor successfully acquires a
// lock-holder row (§13.3). `lock_kind` is one of "named" | "scope" | "claim"
// and selects which of the kind-specific fields are populated.
message LockAcquiredPayload {
  string lock_kind = 1;                    // "named" | "scope" | "claim"
  string lock_name = 2;                    // populated for kind="named"
  string producer_name = 3;                // populated for kind in ("scope","claim")
  google.protobuf.Struct scope_data = 4;   // populated for kind="scope"
  string claim_id = 5;                     // populated for kind="claim"
  string supervisor_id = 6;                // holder_supervisor_id
  string holder_id = 7;                    // rimsky_claim_handles.id (UUID as text)
  bool resumed = 8;                        // true when this acquisition rebound a preserve-for-resume row
}

// LockReleasedPayload is emitted when a supervisor releases a lock-holder
// row at terminal (§13.6). `action` records the release intent.
message LockReleasedPayload {
  string lock_kind = 1;                    // "named" | "scope" | "claim"
  string lock_name = 2;
  string producer_name = 3;
  string claim_id = 4;
  string holder_id = 5;
  string supervisor_id = 6;
  string action = 7;                       // "commit" | "give_up" | "discard" | "preserve_for_resume"
}

// LockOrphanReapedPayload is emitted by the scheduler's lock-holder sweep
// (§13.5 step 2) when a lock-holder row's `expires_at` has passed.
message LockOrphanReapedPayload {
  string lock_kind = 1;                    // "named" | "scope" | "claim"
  string lock_name = 2;
  string producer_name = 3;
  string claim_id = 4;
  string holder_id = 5;
  string prior_supervisor_id = 6;          // supervisor whose row was reaped
  google.protobuf.Timestamp expired_at = 7;
}

// AttributesSubstitutedPayload is emitted at dispatch when rimsky completes
// the source-directive substitution pass that populates
// `rimsky_node_attributes.data` (§5.7 / §10.2).
message AttributesSubstitutedPayload {
  // Names of attribute schema properties that were populated by source
  // directives during this dispatch substitution pass.
  repeated string substituted_fields = 1;
  // Names of optional attribute schema properties whose source directives
  // failed to resolve and were therefore omitted from `data` (per §10.3).
  repeated string omitted_fields = 2;
  // Reserved (was: int32 run_attempt = 3). Removed per per-run attribute
  // keying spec — each dispatch has a fresh node_run_id; consumers
  // counting retries migrate to consecutive_retries_no_progress on
  // rimsky_node_runs.
  reserved 3;
  reserved "run_attempt";
}

// AttributesCommittedPayload is emitted when an executor's terminal
// `attributes_delta` is merged into `rimsky_node_attributes.data` and
// validated successfully (§5.7).
message AttributesCommittedPayload {
  // Producer-declared change flag — drives cascade propagation (§4.3 of the
  // node-graph design doc). Trust + audit log; rimsky does not hash-and-check.
  bool changed = 1;
  // Names of attribute schema properties touched by this commit (executor
  // writeback merged into `data`).
  repeated string updated_fields = 2;
  string change_summary = 3;
}

// AttributesValidationFailedPayload is emitted when JSON-schema validation
// of `rimsky_node_attributes.data` fails at commit (§5.7.1: commit-time
// `attributes_schema_failed`). Dispatch-time required-source resolution
// failures are emitted as `template_resolution_failed` with their own
// payload — they do not surface here.
message AttributesValidationFailedPayload {
  // Field 1 (`phase`) removed: this event is commit-only by §5.7.1.
  // Dispatch-time substitution failures are `template_resolution_failed`.
  reserved 1;
  reserved "phase";
  // Structured per-error details (path, keyword, message). One Struct per
  // schema violation.
  repeated google.protobuf.Struct errors = 2;
}

// ClaimAcquiredPayload is emitted at the same moment as `lock_acquired` for
// a claim-kind lock — it carries the claim-specific bookkeeping the lock
// event doesn't (`hold`, on-commit/on-give-up declarations).
message ClaimAcquiredPayload {
  string claim_id = 1;
  string producer_name = 2;
  bool hold = 3;                           // §5.6.3
  string on_commit = 4;                    // "pop" | "pop_and_move" | "pop_and_delete" | "recycle"
  string on_give_up = 5;                   // same vocabulary as on_commit
}

// ClaimHeldPayload is emitted at commit of a claiming-source node when
// `hold: true` and `rimsky_claim_holders` rows are inserted, one per
// terminal-leaf identified by the §11.4 DAG walk.
message ClaimHeldPayload {
  string claim_id = 1;
  string producer_name = 2;
  // Terminal-leaf node ids that participate in the held claim (one row per
  // id was inserted into rimsky_claim_holders).
  repeated string terminal_node_ids = 3;
}

// ClaimResolvedPayload is emitted when the §5.6.4 resolution algorithm
// runs for a held claim — either at terminal-node release or via the
// scheduler's claim-holder GC sweep (§13.5 step 3). Carries `action`,
// `claim_id`, `producer_name` per spec §9.8.
message ClaimResolvedPayload {
  string action = 1;                       // "commit" | "abandon" — the rimsky-side verb fired at held-claim resolution
  string claim_id = 2;
  string producer_name = 3;
}

// TemplateResolutionFailedPayload is emitted when a required source directive
// fails to resolve at dispatch (§5.7.1, §10.3, §10.4). The error class is
// `template_resolution_failed`; this payload carries the directive text and
// failure reason for debugging.
message TemplateResolutionFailedPayload {
  // The unresolved directive (e.g. `{{deps.upstream.field}}`).
  string directive = 1;
  // Where the directive appeared: "attribute" | "lock_name" | "scope".
  string site = 2;
  // For site="attribute": the attribute schema property name.
  string field = 3;
  string reason = 4;
}
