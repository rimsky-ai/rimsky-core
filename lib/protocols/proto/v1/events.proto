syntax = "proto3";

package rimsky.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rimsky-ai/rimsky-core/lib/protocols/proto/v1/gen;genv1";

enum OperationalKind {
  OPERATIONAL_KIND_UNSPECIFIED = 0;
  OPERATIONAL_KIND_AUTH_ACCESS_ATTEMPTED = 1;
  OPERATIONAL_KIND_AUTH_ACCESS_DENIED = 2;
  OPERATIONAL_KIND_AUTH_KEY_CREATED = 3;
  OPERATIONAL_KIND_AUTH_KEY_REVOKED = 4;
  OPERATIONAL_KIND_AUTH_KEY_ROTATED = 5;
  OPERATIONAL_KIND_STATE_TRANSITION = 10;
  OPERATIONAL_KIND_WORK_STARTED = 11;
  OPERATIONAL_KIND_WORK_COMPLETED = 12;
  OPERATIONAL_KIND_WORK_REJECTED = 13;
  reserved 14;
  reserved "OPERATIONAL_KIND_HEARTBEAT_LOST";
  OPERATIONAL_KIND_NO_OP_COMMIT = 15;
  OPERATIONAL_KIND_OPERATOR_OVERRIDE = 16;
  OPERATIONAL_KIND_UNRESOLVED_EXECUTOR = 17;
  OPERATIONAL_KIND_INSTANCE_TERMINATED = 18;
  OPERATIONAL_KIND_ERROR = 19;
  OPERATIONAL_KIND_LOCK_ACQUIRED = 20;
  OPERATIONAL_KIND_LOCK_RELEASED = 21;
  OPERATIONAL_KIND_LOCK_ORPHAN_REAPED = 22;
  OPERATIONAL_KIND_CLAIM_ACQUIRED = 30;
  OPERATIONAL_KIND_CLAIM_HELD = 31;
  OPERATIONAL_KIND_CLAIM_RESOLVED = 32;
  OPERATIONAL_KIND_ORPHANED_CLAIM_RELEASED = 33;
  OPERATIONAL_KIND_ORPHANED_CLAIM_LOST_RACE = 34;
  OPERATIONAL_KIND_CLAIM_RESOLUTION_COMMIT = 35;
  OPERATIONAL_KIND_CLAIM_RESOLUTION_ABANDON = 36;
  OPERATIONAL_KIND_ATTRIBUTES_SUBSTITUTED = 40;
  OPERATIONAL_KIND_ATTRIBUTES_COMMITTED = 41;
  reserved 42;
  reserved "OPERATIONAL_KIND_ATTRIBUTES_VALIDATION_FAILED";
  OPERATIONAL_KIND_ATTRIBUTES_SCHEMA_FAILED = 43;
  OPERATIONAL_KIND_ATTRIBUTE_OVERRIDE_MATCHED = 47;
  OPERATIONAL_KIND_TEMPLATE_RESOLUTION_FAILED = 44;
  OPERATIONAL_KIND_TEMPLATE_VALIDATION_FAILED = 45;
  OPERATIONAL_KIND_EXECUTOR_SCHEMA_UNAVAILABLE = 46;
  OPERATIONAL_KIND_BREAKPOINT_HIT = 50;
  OPERATIONAL_KIND_MESSAGE_SENT = 60;
  OPERATIONAL_KIND_MESSAGE_RECEIVED = 61;
  OPERATIONAL_KIND_MESSAGE_DEAD_LETTERED = 62;
  OPERATIONAL_KIND_FAN_OUT_DISPATCHED = 70;
  OPERATIONAL_KIND_FANOUT_CHILDREN_CREATED = 71;
  OPERATIONAL_KIND_SUBCLAIM_BEGIN_CANDIDATE = 72;
  OPERATIONAL_KIND_SUBCLAIM_ACQUIRED = 73;
  OPERATIONAL_KIND_SUBGRAPH_INTERNAL_CASCADE_FIRED = 74;
  OPERATIONAL_KIND_SUBGRAPH_DISPATCHED = 75;
  OPERATIONAL_KIND_SUBGRAPH_EXIT_CARRY = 76;
  reserved 80;
  reserved "OPERATIONAL_KIND_PARK_TIMEOUT";
  OPERATIONAL_KIND_PARKED_RESUME_STARTED = 81;
  OPERATIONAL_KIND_DEBUG_OVERRIDE_APPLIED = 82;
}

message Event {
  int64 id = 1;
  string instance_id = 2;
  string node_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string kind = 5;
  reserved 16, 18, 19, 24, 26, 27;
  reserved "commit", "quality_rule_failed", "heartbeat_lost", "schedule_fired", "pure_cascade_commit", "schedule_dispatch_failed";
  reserved 28, 29, 45;
  reserved "attributes_validation_failed";
  oneof payload {
    MessageSentPayload message_sent = 10;
    MessageReceivedPayload message_received = 11;
    StateTransitionPayload state_transition = 12;
    ErrorPayload error = 13;
    WorkStartedPayload work_started = 14;
    WorkCompletedPayload work_completed = 15;
    NoOpCommitPayload no_op_commit = 17;
    OperatorOverridePayload operator_override = 20;
    OrphanedClaimReleasedPayload orphaned_claim_released = 21;
    OrphanedClaimLostRacePayload orphaned_claim_lost_race = 22;
    WorkRejectedPayload work_rejected = 23;
    UnresolvedExecutorPayload unresolved_executor = 25;

    LockAcquiredPayload lock_acquired = 40;
    LockReleasedPayload lock_released = 41;
    LockOrphanReapedPayload lock_orphan_reaped = 42;
    AttributesSubstitutedPayload attributes_substituted = 43;
    AttributesCommittedPayload attributes_committed = 44;
    ClaimAcquiredPayload claim_acquired = 46;
    ClaimHeldPayload claim_held = 47;
    ClaimResolvedPayload claim_resolved = 48;
    TemplateResolutionFailedPayload template_resolution_failed = 49;

    AttributesSchemaFailedPayload attributes_schema_failed = 55;
    AttributeOverrideMatchedPayload attribute_override_matched = 56;
    FanOutDispatchedPayload fan_out_dispatched = 59;
    SubgraphInternalCascadeFiredPayload subgraph_internal_cascade_fired = 63;
    ParkedResumeStartedPayload parked_resume_started = 67;
    InstanceTerminatedPayload instance_terminated = 69;

  }
  google.protobuf.Struct payload_raw = 30;
}

message MessageSentPayload {
  string type = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  google.protobuf.Struct params = 4;
}

message MessageReceivedPayload {
  string type = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  google.protobuf.Struct params = 4;
}

message StateTransitionPayload {
  string from = 1;
  string to = 2;
  string reason = 3;
}

message ErrorPayload {
  string error_class = 1;
  google.protobuf.Struct details = 2;
  string action_taken = 3;
  int64 delay_ms = 5;
}

message WorkStartedPayload {
  string supervisor_id = 1;
  string dispatch_id = 2;
}

message WorkCompletedPayload {
  reserved 1;
  reserved "outcome";
  string supervisor_id = 2;
  string dispatch_id = 3;
  string terminal_kind = 4;
}

message NoOpCommitPayload {
  string reason = 1;
}

message OperatorOverridePayload {
  string action = 1;
  string actor = 2;
  string reason = 3;
  reserved 4;
  reserved "restore_version";
}

message OrphanedClaimReleasedPayload {
  string dispatch_id = 1;
  string prior_claimed_by = 2;
  reserved 3;
  reserved "claimed_at";
  google.protobuf.Timestamp last_progress_at = 4;
  string error_class = 5;
  string reason = 6;
  string callback_url = 7;
}

message OrphanedClaimLostRacePayload {
  string supervisor_id = 1;
  string dispatch_id = 2;
  reserved 3, 4, 5;
  reserved "ownership_kind", "current_claimed_by", "winning_supervisor_id";
}

message WorkRejectedPayload {
  string reason = 1;
  google.protobuf.Struct errors = 2;
}

message UnresolvedExecutorPayload {
  reserved 1;
  reserved "node_id";
  string executor_name = 2;
  string supervisor_id = 3;
}

message LockAcquiredPayload {
  string lock_kind = 1;
  string lock_name = 2;
  string producer_name = 3;
  reserved 4, 5, 8;
  reserved "claim_id", "resumed";
  string supervisor_id = 6;
  string holder_id = 7;
  string alias = 9;
  string intent = 10;
}

message LockReleasedPayload {
  string lock_kind = 1;
  string lock_name = 2;
  string producer_name = 3;
  reserved 4;
  reserved "claim_id";
  string holder_id = 5;
  string supervisor_id = 6;
  string action = 7;
  string alias = 8;
}

message LockOrphanReapedPayload {
  string lock_kind = 1;
  string lock_name = 2;
  string producer_name = 3;
  reserved 4, 5, 6;
  reserved "claim_id", "holder_id", "prior_supervisor_id";
  google.protobuf.Timestamp expires_at = 7;
  string claim_handle_id = 8;
  string supervisor_id = 9;
  string holder_node_id = 10;
  google.protobuf.Timestamp claimed_at = 11;
  string intent = 12;
}

message AttributesSubstitutedPayload {
  repeated string substituted_fields = 1;
  reserved 2;
  reserved "omitted_fields";
  reserved 3;
  reserved "run_attempt";
}

message AttributesCommittedPayload {
  bool changed = 1;
  repeated string updated_fields = 2;
  string change_summary = 3;
}

message ClaimAcquiredPayload {
  string claim_id = 1;
  string producer_name = 2;
  bool hold = 3;
  string on_commit = 4;
  string on_give_up = 5;
}

message ClaimHeldPayload {
  string claim_id = 1;
  string producer_name = 2;
  repeated string terminal_node_ids = 3;
}

message ClaimResolvedPayload {
  string action = 1;
  string claim_id = 2;
  string producer_name = 3;
}

message TemplateResolutionFailedPayload {
  string directive = 1;
  string site = 2;
  string field = 3;
  string reason = 4;
}

message AuthAccessAttemptedPayload {
  optional string key_id = 1;
  string key_name = 2;
  string identity_kind = 3;
  string protocol_skin = 4;
  string action = 5;
  string request_path = 6;
  string request_method = 7;
  google.protobuf.Struct request_params = 8;
  bool request_params_invalid = 9;
  int32 response_status = 10;
  string mode = 11;
  bool executed = 12;
  int64 duration_ms = 13;
  string client_ip = 14;
  string user_agent = 15;
}

message AuthAccessDeniedPayload {
  optional string key_id = 1;
  optional string key_name = 2;
  optional string identity_kind = 3;
  string protocol_skin = 4;
  optional string action = 5;
  string request_path = 6;
  string request_method = 7;
  google.protobuf.Struct request_params = 8;
  bool request_params_invalid = 9;
  int32 response_status = 10;
  optional string mode = 11;
  bool executed = 12;
  int64 duration_ms = 13;
  string client_ip = 14;
  string user_agent = 15;
  string denial_reason = 16;
}

message AuthKeyCreatedPayload {
  string key_id = 1;
  string key_name = 2;
  google.protobuf.Struct permissions = 3;
  optional string created_by_key_id = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message AuthKeyRevokedPayload {
  string key_id = 1;
  string key_name = 2;
  optional string revoked_by_key_id = 3;
  string reason = 4;
}

message AuthKeyRotatedPayload {
  string key_id = 1;
  string key_name = 2;
  string old_key_id = 3;
  string new_key_id = 4;
  google.protobuf.Timestamp revoke_at = 5;
  optional string rotated_by_key_id = 6;
}

message AttributesSchemaFailedPayload {
  string message = 1;
}

message AttributeOverrideMatchedPayload {
  int32 override_index = 1;
  string node_type = 2;
  repeated string fields = 3;
}

message BreakpointHitPayload {
  string instance_id = 1;
  string node_id = 2;
  string breakpoint_id = 3;
  string hit_id = 4;
  string checkpoint = 5;
  string mode = 6;
}

message MessageDeadLetteredPayload {
  string message_id = 1;
  string message_type = 2;
  string reason = 3;
}

message FanOutDispatchedPayload {
  string parent_run_id = 1;
  repeated string child_run_ids = 2;
  repeated string child_keys = 3;
  int32 parallelism = 4;
  string policy_kind = 5;
  int32 num_sub_claims = 6;
}

message FanOutChildrenCreatedPayload {
  string parent_run_id = 1;
  string parent_node_id = 2;
  int32 child_count = 3;
  int32 partition_keys_count = 4;
}

message SubClaimBeginCandidatePayload {
  string parent_claim_handle_id = 1;
  string sub_claim_handle_id = 2;
  string producer_name = 3;
  int64 candidate_handle_size_bytes = 4;
}

message SubClaimAcquiredPayload {
  string parent_claim_handle_id = 1;
  int32 sub_scope_descriptor_count = 2;
  string producer_name = 3;
}

message SubgraphInternalCascadeFiredPayload {
  string delegate_graph = 1;
  string calling_run_id = 2;
  string settling_signal_type = 3;
  bool changed = 4;
  int32 child_count = 5;
}

message SubgraphDispatchedPayload {
  string caller_run_id = 1;
  string caller_node_id = 2;
  string subgraph_name = 3;
  repeated string child_aliases = 4;
  int32 child_count = 5;
}

message SubgraphExitCarryPayload {
  string parent_run_id = 1;
  string exit_run_id = 2;
  string exit_node_alias = 3;
  string outcome = 4;
}

message ClaimResolutionSettledPayload {
  string claim_handle_id = 1;
  string run_id = 2;
  string frame_id = 3;
  string producer_name = 4;
  string claim_scope_data_hash = 5;
  string version_id = 6;
  optional string parent_claim_handle_id = 7;
  string cause = 8;
}

message ParkedResumeStartedPayload {
  string resume_reason = 1;
  string supervisor_id = 2;
}

message DebugOverrideAppliedPayload {
  string action = 1;
  string node_type = 2;
  string gate_state = 3;
  string actor = 4;
  int32 runs_mutated = 5;
  string attribute_key = 6;
  google.protobuf.Value attribute_value = 7;
}

message InstanceTerminatedPayload {
  string actor = 1;
  string reason = 2;
}

message TerminalSuccessSignalPayload {
  bool changed = 1;
  google.protobuf.Struct attributes_delta = 2;
  string change_summary = 3;
  repeated string tags = 4;
}

message TerminalErrorSignalPayload {
  string error_class = 1;
  google.protobuf.Struct error_payload = 2;
  int32 attempt = 3;
  int32 retries_so_far = 4;
  google.protobuf.Struct attributes_delta = 5;
  repeated string tags = 6;
}

message TransientParkSignalPayload {
  google.protobuf.Timestamp resume_at = 1;
  repeated string tags = 2;
  int32 scratch_size = 3;
  bool scratch_spilled = 4;
}

message TransientRetrySignalPayload {
  int32 attempt = 1;
  int32 cap = 2;
  string error_class = 3;
  int32 delay_ms = 4;
  google.protobuf.Struct error_payload = 5;
  reserved 6;
  reserved "discarded_claims";
}

message TransientAwaitAsyncSignalPayload {
  string async_ack_id = 1;
  string callback_url = 2;
}

message TransientInfraSignalPayload {
  string reason = 1;
  google.protobuf.Struct details = 2;
}

message TransientReleaseAndRequeueSignalPayload {
  string error_class = 1;
  google.protobuf.Struct error_payload = 2;
}

message AttributeChangedSignalPayload {
  string key = 1;
  google.protobuf.Value value = 2;
  google.protobuf.Value old_value = 3;
}

message SettlingSignalPayload {
  string error_class = 1;
}
