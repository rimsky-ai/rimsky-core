syntax = "proto3";

package rimsky.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rimsky-ai/rimsky-core/lib/protocols/proto/v1/gen;genv1";

// @decision: grpc-internal-protocols
service Executor {
  // @decision: executor-unary-rpc
  rpc Execute(ExecuteRequest) returns (Outcome);
}

message ExecuteRequest {
  string node_id = 1;
  string instance_id = 2;
  string node_type = 3;

  reserved 4;
  reserved "userdata";

  google.protobuf.Struct attributes = 5;

  google.protobuf.Struct attributes_schema = 6;

  map<string, ClaimProducerHandle> claim_producers = 7;

  string callback_url = 8;

  string cancel_token = 9;

  reserved 10;
  reserved "resumed";

  reserved 11;
  reserved "run_attempt";

  string dispatch_id = 12;

  reserved 13;
  reserved "resume_context";

  // @concept: run-scope
  optional string prior_dispatch_id = 14;

  optional PriorDispatchDisposition prior_dispatch_disposition = 15;

  // @concept: run-scope
  string run_scope_id = 16;

  bytes scratch = 17;
}

enum PriorDispatchDisposition {
  PRIOR_NONE              = 0;
  PRIOR_STALE_RECOVERY    = 1;
  PRIOR_RETRY_AFTER_ERROR = 2;
  PRIOR_RECALCULATE       = 3;
}

message ClaimProducerHandle {
  string kind = 1;
  google.protobuf.Struct handle = 2;
  reserved 3, 4, 5;
  reserved "write_regions", "read_regions", "resumed";
  bytes candidate_handle = 6;
}

message Outcome {
  oneof outcome {
    Success            success     = 1;
    Error              error       = 2;
    Park               park        = 3;
    AwaitAsyncCallback await_async = 4;
  }
}

message Success {
  bool changed = 1;
  string change_summary = 2;
  google.protobuf.Struct attributes_delta = 3;
  bytes scratch = 4;
  repeated string tags = 5;
}

message Error {
  string error_class = 1;
  google.protobuf.Struct payload = 2;
  bytes scratch = 3;
  google.protobuf.Struct attributes_delta = 4;
  repeated string tags = 5;
}

message Park {
  reserved 1;
  reserved "reason";
  reserved 2;
  reserved "payload";
  google.protobuf.Timestamp resume_at = 3;
  reserved 4;
  reserved "session_token";
  reserved 5, 6;
  reserved "reason_note", "reason_label";
  bytes scratch = 7;
  reserved 8;
  reserved "attributes_delta";
  repeated string tags = 9;
}

message AwaitAsyncCallback {
  string async_ack_id = 1;
  int64 expected_completion_ms = 2;
}

message AsyncCallbackBody {
  reserved 1;
  reserved "events";
  oneof outcome {
    Success success = 2;
    Error   error   = 3;
    Park    park    = 4;
  }
}
