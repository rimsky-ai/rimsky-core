# Example config for the standard postgres store-service. Per spec §6.3
# each store-service owns its own config schema; rimsky neither defines
# nor validates this file.

# Postgres connection string for the store's own pool.
connection: "postgres://store_postgres:store_postgres@db:5432/rimsky?sslmode=disable"

# Store's advertised write_semantics. Operator declares the same
# value in stores.yml; the rimsky-side handshake is strict-equal.
write_semantics: sync

# Pick policies are store-internal — rimsky never sees them. Each
# entry is keyed by the recognized selector form (recommended:
# `@policy-name`). The store handles FOR UPDATE SKIP LOCKED on the
# items table at Open time and the on_commit / on_give_up routing at
# Commit / Abandon.
pick_policies:
  "@review-queue":
    items_table: topics_items
    on_commit: recycle
    on_give_up: recycle
    visibility_timeout_seconds: 300

# Partition policies are operator-declared queries the store's SplitScope
# verb dispatches when a template's `partition_request` selects one by name
# via {"partition_policy": "@<name>", "params": {...}}. Each policy names
# the items_table, a select column list, a parameterized where clause, and
# a params_schema whose properties (top-level key order) declares the
# binding order of $1..$N. Only the property NAMES (key order) are
# load-bearing; per-property type metadata is documentary — postgres
# rejects type-mismatched values at query time.
# partition_policies:
#   "@open_issues":
#     items_table: issues
#     # CONVENTION: the FIRST selected column is used as the row id and
#     # becomes the partition_key on each emitted sub-claim. The store
#     # warns at startup if it doesn't look like an id column. Place
#     # `id` (or your row-identifier column) first.
#     select: "id, payload"
#     where: "status = $1 AND created_at > $2"
#     params_schema:
#       properties:
#         status: {}
#         since: {}
#     limit: 100

# Listen addresses. The admin port hosts the store-internal items
# insertion endpoint (per spec §13.1).
host: 0.0.0.0
grpc_port: 9101
http_port: 9111
admin_port: 9121

# Store's internal sweep interval (visibility-timeout reclamation).
sweep_interval_seconds: 30

# Per spec 2026-05-19 §Item 6: when true, the binary registers the
# Executor protocol alongside ClaimProducer on the same gRPC server.
# Reuses the store's own connection pool to run aggregate-only SQL
# verifier checks against staged content. Operators wanting role
# isolation deploy two binaries with distinct env (e.g. read-only DB
# role for the verifier).
# enable_executor: true
