# Example config for the standard direct-mode filesystem store-service.
# Each store-service owns its own config schema; rimsky neither defines
# nor validates this file.
#
# Selector grammar: concrete paths only. Glob support is out of scope —
# byte-equal region conflict requires store canonicalisation, and glob
# canonicalisation is out of scope for the standard filesystem.
# Operators who need glob semantics write a custom store-service.

# Filesystem root: every selector resolves to <root>/<path>.
root: /var/lib/rimsky-store/content

# Listen addresses.
host: 0.0.0.0
grpc_port: 9100
http_port: 9110
