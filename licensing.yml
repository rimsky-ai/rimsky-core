# Rimsky licensing boundary map.
# Single source of truth for the per-file license headers and the
# import-graph lint enforced by `cmd/rimsky-license-check/`. See
# docs/history/2026-05-02-licensing-design.md for rationale.
#
# Update procedure: edit this file, run `make license-lint` to verify
# import direction, then run `make license-stamp` to update per-file
# headers.
#
# Path classification rule: longest-prefix-match wins. Subdirectories of
# AGPL paths can be reclassified Apache by being listed under the apache:
# block (e.g. runtime/remote/ is Apache despite living under runtime/
# AGPL — the gRPC client to ClaimProducer impls is interface-shaped so
# that out-of-tree adopters can dial producer impls without crossing
# the boundary).
#
# Post-2026-05-13 four-layer restructure note: the old `foundation/integration/`
# directory was renamed to `runtime/` (root module bridge layer) and
# `graph/executor/` was renamed to `runtime/executor/`. The boundary
# rules carry over: `runtime/` is AGPL (orchestrator-internal bridge)
# with `runtime/remote/` and `runtime/executor/` carved out as Apache
# (interface-shaped client surfaces).

apache:
  - protocols/
  - foundation/locks/
  - foundation/shared/
  - foundation/spec/
  - runtime/remote/
  - runtime/executor/
  - runtime/clientiface/
  - control/cli/
  - graph/node/
  - graph/shared/
  - graph/template/canonical/
  - conformance/
  - stores/
  - executors/
  - sensors/
  - subscribers/
  - examples/
  - cmd/rimsky-cli/
  - cmd/rimsky-executor-conformance/
  - cmd/rimsky-claim-producer-conformance/
  - cmd/rimsky-conformance-probe/
  - cmd/rimsky-data-processing-conformance/
  - cmd/rimsky-publisher-conformance/
  - cmd/rimsky-validation-conformance/
  - cmd/rimsky-license-check/
  - cmd/rimsky-docs-glossary/
  - cmd/rimsky-docs-llms-full/
  - cmd/rimsky-docs-lint/
  - dashboards/
  - deploy/
  - docs/
  - cold-read/
  # Top-level files and dotfiles default to Apache (build config, README,
  # CHANGELOG, Makefile, .golangci.yml, etc.). Non-source files (LICENSE.*,
  # COPYRIGHT, NOTICE, TRADEMARKS.md, CLA.md, CONTRIBUTING.md, licensing.yml,
  # this file itself) carry no header and are exempt from the lint.

agpl:
  - foundation/cascade/
  - foundation/persistence/
  - foundation/internal/
  - graph/attribute/
  - control/config/
  - control/controlapi/
  - graph/frame/
  - internal/
  - control/observability/
  - graph/scenario/
  - graph/scheduler/
  - runtime/  # excludes runtime/remote/ and runtime/executor/ (overrides above)
  - mcp-servers/
  - cmd/rimsky-scheduler/
  - cmd/rimsky-supervisor/
  - cmd/rimsky-control-api/
  - cmd/rimsky-migrate/
  - cmd/rimsky-entrypoint/
  - cmd/rimsky-blob-backend-conformance/
  - test/

exempt:
  # Non-source files at the repo root that carry no per-file header.
  - LICENSE.apache
  - LICENSE.agpl
  - COPYRIGHT
  - NOTICE
  - TRADEMARKS.md
  - CLA.md
  - CONTRIBUTING.md
  - licensing.yml
  - go.mod
  - go.sum
  - go.work
  - go.work.sum
  - .gitignore
  - .gitattributes
  - .dockerignore
  # Build artifacts and vendor trees. The walker only hard-skips VCS dirs
  # (.git, .svn, .hg); every other "skip me" directory must be listed here.
  - bin/
  - protocols/proto/v1/gen/  # generated bindings — handled separately by protoc plugin
  - cmd/rimsky-docs-lint/testdata/  # fixture .proto and .md content; not source
  - executors/claude-agent/node_modules/
  - executors/claude-agent/dist/
  - executors/claude-agent/build/
  - executors/claude-agent/.cache/
  - dashboards/rimsky-dashboard/node_modules/
  - dashboards/rimsky-dashboard/dist/
  - dashboards/rimsky-dashboard/build/
  - dashboards/rimsky-dashboard/.cache/
  - .elves/
  # Binary blobs are skipped by the walker (see cmd/rimsky-license-check/).
