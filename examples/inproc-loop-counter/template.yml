name: inproc-loop-counter-demo
version: 1.0.0
frame_resolution_mode: coalesce
nodes:
  - type: counter
    kind: loop_counter
    # Self-subscribe on `terminal/success` with a CEL `when:` filter
    # over `payload.tags` so the counter re-fires within the same
    # RunScope on each `loop` tag. With max=3 the counter dispatches
    # three times: dispatches 1 and 2 emit Success with the `loop` tag
    # (new_count 1, 2 < max=3); dispatch 3 emits Success with the
    # `done` tag (new_count 3 == max). Per concept:terminal-tag tags
    # ride on the settling terminal verdict; subscribers route on
    # `payload.tags` via CEL list membership.
    #
    # Loop termination: only the `loop` tag triggers cascade re-fire.
    # When the counter emits Success with `done`, no subscription
    # matches the filter, so the cascade has nothing to fan out to and
    # the loop stops. A real template hooks completion by adding
    # another node subscribed on terminal/success with
    # `when: "done" in payload.tags`.
    subscribes:
      - node: counter
        type: terminal/success
        when: '"loop" in payload.tags'
        force_upstream_refresh: false
    attributes:
      schema:
        type: object
        properties:
          max:
            type: integer
            default: 3
