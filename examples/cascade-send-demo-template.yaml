# cascade-send-demo-template.yaml — STORY-cascade-send
# proof template.
#
# A template author expresses a multi-frame workflow — node R reads
# node A's data through a typed-message body that the send-node E
# composed — entirely through the typed-message schema. The demo script
# (cascade-send-demo.sh) deploys this template, drives an initial
# wake message, polls the cascade-graph observability endpoint, and shows
# both the wake frame (operator-sent) and the iterate frame (cascade-
# sent) carrying a triggering_message_id.
#
# The shape is deliberately bounded so the demo converges cleanly:
#
#   frame 1 (trigger=loop/wake):
#     A (verifier-shape-checks) runs → terminal/success → send-node E
#     dispatches → loop/iterate envelope lands in rimsky_messages.
#
#   frame 2 (trigger=loop/iterate):
#     R (verifier-shape-checks) wakes via the typed-message subscription,
#     pulls its `checks` array from {{messages.loop/iterate.checks}} (the
#     body E composed from A's terminal-delta), runs, settles.
#
# After R settles no further message is sent (E does NOT subscribe to
# R), so the queue drains to empty and no more frames open. Two frames,
# both with triggering_message_id, both kinds (operator + instance)
# exhibited. Message payloads are the only channel carrying A's data
# into R's frame — the frames themselves are isolated.
#
# The script's self-checking output greps for both the wake frame and
# the iterate frame and exits non-zero if either is missing.
name: cascade-send-demo
version: "1"
description: |
  STORY-cascade-send proof template. A two-frame workflow:
  wake → A → send-node E → loop/iterate → R. R reads its inputs from
  the typed-message body that E composed — message payloads are the
  only cross-frame carrier.

messages:
  - type: loop/wake
    body_schema:
      type: object
      properties:
        trip_counter: { type: integer }

  - type: loop/iterate
    body_schema:
      type: object
      properties:
        checks:
          type: array
        rows:
          type: array
      required: [checks, rows]

nodes:
  - type: a
    executor: verifier-shape-checks
    description: |
      A subscribes to the initial wake message and runs the bundled
      verifier-shape-checks executor against a real inline dataset.
      Real dispatch — no stub. A's terminal/success drives the send-
      node E.
    subscribes:
      - node: loop/wake
        type: terminal/success
        force_upstream_refresh: false
    attributes:
      schema:
        type: object
        properties:
          checks:
            type: array
            default:
              - kind: no_nulls
                config: { field: id }
              - kind: pk_unique
                config: { field: id }
          rows:
            type: array
            default:
              - { id: alpha, value: 1 }
              - { id: beta, value: 2 }
              - { id: gamma, value: 3 }
        required: [checks, rows]

  - type: sender
    sends_message: loop/iterate
    description: |
      The cross-frame back-edge: sender subscribes to A's terminal/
      success and sends a loop/iterate message whose body carries the
      `checks` array and the `rows` array forwarded from A's attribute
      set. R subscribes to loop/iterate as a virtual node-type and
      reads its body via the typed-message substitution grammar
      ({{messages.loop/iterate.checks}}, {{messages.loop/iterate.rows}}).
    subscribes:
      - node: a
        type: terminal/success
        force_upstream_refresh: false
      - node: a
        type: attribute/checks/changed
        force_upstream_refresh: false
      - node: a
        type: attribute/rows/changed
        force_upstream_refresh: false
    attributes:
      schema:
        type: object
        properties:
          checks:
            type: array
            source: "{{nodes.a.attribute.checks}}"
          rows:
            type: array
            source: "{{nodes.a.attribute.rows}}"
        required: [checks, rows]

  - type: r
    executor: verifier-shape-checks
    description: |
      R is the back-edge receiver: it subscribes to loop/iterate (a
      message type, addressed as a virtual node) and pulls its
      verification inputs from the typed-message body. The message
      payload is the only cross-frame carrier — R's dispatch
      attributes are wholly determined by the body E composed in the
      prior frame.
    subscribes:
      - node: loop/iterate
        type: terminal/success
        force_upstream_refresh: false
    attributes:
      schema:
        type: object
        properties:
          checks:
            type: array
            source: "{{messages.loop/iterate.checks}}"
          rows:
            type: array
            source: "{{messages.loop/iterate.rows}}"
        required: [checks, rows]
