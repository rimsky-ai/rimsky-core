# template-readonly.yaml — STORY-fanout-intent-inheritance half 1.
#
# Fan-out node with claim intent=r. Sub-claims inherit intent=r per
# TD-sub-claim-intent-inheritance. Intent is a cascade-layer contract
# (ModeCoexists), not a producer-side concern; the demo asserts the
# persisted intent column on every sub-claim row matches the parent.
name: fanout-intent-readonly
version: "1"
description: |
  STORY-fanout-intent-inheritance — read-only side. Fan-out claim
  intent=r; sub-claims inherit intent=r in the persisted
  rimsky_claim_handles row, which is the precondition the cascade
  contract (ModeCoexists) relies on.

messages:
  - type: fanout_seed_r
    body_schema:
      type: object
      properties:
        items:
          type: array
      required: [items]

nodes:
  - type: triage_r
    kind: attribute_passthrough
    description: |
      Fan-out parent declaring intent=r. Sub-claims inherit intent=r
      verbatim in the persisted claim-handle row.
    claim_producers:
      - name: pg-store
        selector: "@items-queue-r"
        intent: r
        alias: data
    subscribes:
      - node: fanout_seed_r
        type: terminal/success
        wake_on_change: true
        force_upstream_refresh: false
    fan_out:
      claim: data
      partition_request: "{\"list\":{{messages.fanout_seed_r.items}}}"
      error_policy:
        kind: best_effort
    attributes:
      schema:
        type: object
        properties:
          partition_key:
            type: string
            source: "{{child.partition_key}}"
        required: [partition_key]
