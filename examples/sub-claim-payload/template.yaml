# sub-claim-payload template — STORY-sub-claim-payload-substitution proof.
#
# A fan-out node whose children each substitute their own per-sub-claim
# payload into an output attribute. The producer-supplied payload bytes
# (per element of the list-array partition_request) flow through
# {{claim.fs_queue.payload.v}} into a `processed_value` attribute on
# each child — observable through the per-node API.
#
# Stack prerequisites: same as fanout-fs-list-array (filesystem store
# with @seed-queue pick policy, attribute_passthrough inproc executor).
name: sub-claim-payload
version: "1"
description: |
  STORY-sub-claim-payload-substitution proof: each fan-out child reads
  its own per-sub-claim payload via {{claim.<alias>.payload.v}} and
  writes the value to a `processed_value` output attribute observable
  per-child.

messages:
  - type: fanout_seed
    body_schema:
      type: object
      properties:
        items:
          type: array
      required: [items]

nodes:
  - type: triage
    kind: attribute_passthrough
    description: |
      Fan-out parent. The store's SplitScope returns one
      SubScopeDescriptor per upstream item, carrying that item's
      payload bytes. Each child substitutes its own sub-claim payload
      via {{claim.fs_queue.payload.v}}.
    stores:
      - name: fs-store
        selector: "@seed-queue"
        intent: rw
        alias: fs_queue
    subscribes:
      - node: fanout_seed
        type: terminal/success
        wake_on_change: true
        force_upstream_refresh: false
    fan_out:
      claim: fs_queue
      partition_request: "{\"list\":{{messages.fanout_seed.items}}}"
      error_policy:
        kind: best_effort
    attributes:
      schema:
        type: object
        properties:
          partition_key:
            type: string
            source: "{{child.partition_key}}"
          processed_value:
            type: number
            source: "{{claim.fs_queue.payload.v}}"
        required: [partition_key, processed_value]
