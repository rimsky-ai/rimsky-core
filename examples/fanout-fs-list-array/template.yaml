# fanout-fs-list-array template — STORY-fs-fanout-list-array proof.
#
# A template author declares a fan-out node whose parent claim is held
# against the bundled filesystem store, with partition_request
# substituted from an upstream operator-posted message carrying a list
# of {key, payload} objects. The filesystem store's SplitScope decodes
# the `{"list": [...]}` shape and returns one SubScopeDescriptor per
# element; rimsky dispatches one child per sub-claim with
# {{child.partition_key}} = element.key and
# {{claim.fs_queue.payload}} = element.payload.
#
# The demo script (demo.sh) registers this template, deploys, creates an
# instance, posts a `fanout_seed` message carrying three items, and polls
# until three children show three distinct partition keys and three
# distinct echoed payloads — exhibiting the story's user-observable
# outcome: one parallel child per upstream item, no custom producer.
#
# Stack prerequisites (operator-side):
#   - rimsky stack reachable at RIMSKY_CONTROL_API_URL
#   - bundled `rimsky-claim-producer-filesystem` registered as claim producer
#     `claim-producer-filesystem` in rimsky.yml advertising supports_split_scope=true
#     and a pick policy `@seed-queue` over a seed root containing one
#     pre-seeded folder (see seed/queue/example-job/.gitkeep)
#   - bundled `attribute_passthrough` inproc executor available
#     (auto-registered by `rimsky compose run` and the all-in-one image)
name: fanout-fs-list-array
version: "1"
description: |
  STORY-fs-fanout-list-array proof: a fan-out node whose parent claim
  is filesystem-store-backed; partition_request substitutes a list of
  {key, payload} items from an operator message; three children
  dispatch, each carrying its own partition_key and per-sub-claim
  payload.

messages:
  - type: fanout_seed
    body_schema:
      type: object
      properties:
        items:
          type: array
      required: [items]

nodes:
  - type: triage
    kind: attribute_passthrough
    description: |
      The fan-out parent. Holds one filesystem-store claim against the
      `@seed-queue` pick policy; its partition_request reads the
      operator-posted `fanout_seed` message's `items` array. The
      filesystem store's SplitScope decodes the `{"list": [...]}`
      shape and emits one SubScopeDescriptor per element; rimsky
      acquires one sub-claim and dispatches one child per element.
    claim_producers:
      - name: claim-producer-filesystem
        selector: "@seed-queue"
        intent: rw
        alias: fs_queue
    subscribes:
      - node: fanout_seed
        type: terminal/success
        force_upstream_refresh: false
    fan_out:
      claim: fs_queue
      partition_request: "{\"list\":{{messages.fanout_seed.items}}}"
      error_policy:
        kind: best_effort
    attributes:
      schema:
        type: object
        properties:
          partition_key:
            type: string
            source: "{{child.partition_key}}"
          processed_payload:
            type: object
            source: "{{claim.fs_queue.payload}}"
        required: [partition_key]
