# template-undeclared.yaml — STORY-messages-as-nodes-substitution half 2.
#
# References `{{messages.bar.x}}` without declaring `bar` in messages:.
# Registration must fail with an error naming `bar` and the missing
# `messages:` declaration. The demo asserts the failure on POST
# /v1/templates.
name: messages-as-nodes-undeclared
version: "1"
description: |
  STORY-messages-as-nodes-substitution — undeclared case. Registration
  must reject this template because messages.bar.x names a type not in
  the messages: registry.

nodes:
  - type: receiver
    kind: attribute_passthrough
    description: |
      Reads {{messages.bar.x}} without declaring bar in messages:.
      Registration must fail.
    attributes:
      schema:
        type: object
        properties:
          from_message:
            type: string
            source: "{{messages.bar.x}}"
        required: [from_message]
