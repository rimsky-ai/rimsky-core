# Postgres claim-producer config for STORY-fanout-list-array. The
# operator mounts this at /etc/store/config.yml when running the postgres
# bundled claim-producer image; the items table schema and seed are
# described in the demo.sh prerequisites.

connection: "postgres://store_postgres:store_postgres@db:5432/rimsky?sslmode=disable"

write_semantics: sync

# A trivial pick policy serves as the parent claim's substrate identity;
# the SplitScope path's `list` shape does not consult the pick policy's
# items_table for partitioning — the upstream-supplied list drives the
# sub-scopes — but the parent Open does need a real policy to claim
# against.
pick_policies:
  "@items-queue":
    items_table: pgfanout_items
    on_commit: recycle
    on_give_up: recycle
    visibility_timeout_seconds: 300

host: 0.0.0.0
grpc_port: 9101
http_port: 9111
admin_port: 9121
sweep_interval_seconds: 30
