# fanout-pg-list-array template — STORY-fanout-list-array proof, postgres backend.
#
# Same shape as the filesystem claim-producer list-array story, but the
# parent claim is held against the bundled postgres claim producer. The
# producer's SplitScope decodes the `{"list": [...]}` shape (shared helper) and
# returns one SubScopeDescriptor per element with PartitionKey =
# element.key and Payload = element.payload.
#
# Stack prerequisites (operator-side):
#   - rimsky stack reachable at RIMSKY_CONTROL_API_URL
#   - bundled `rimsky-claim-producer-postgres` registered as claim producer
#     `claim-producer-postgres` advertising supports_split_scope=true and a pick
#     policy `@items-queue` over a `pgfanout_items` table (see
#     producer-config.yml in this directory for the wiring shape)
#   - the items table seeded with at least one row keyed by some id so
#     the parent Open succeeds; the partition_request shape does not
#     re-read this table — substitution from upstream supplies the
#     elements
#   - bundled `attribute_passthrough` inproc executor
name: fanout-pg-list-array
version: "1"
description: |
  STORY-fanout-list-array proof, postgres backend: a fan-out node whose parent claim
  is postgres claim-producer-backed; partition_request is a list of items
  substituted from an operator-posted message; three children
  dispatch, each carrying its own partition_key and per-sub-claim
  payload.

messages:
  - type: fanout_seed
    body_schema:
      type: object
      properties:
        items:
          type: array
      required: [items]

nodes:
  - type: triage
    kind: attribute_passthrough
    description: |
      Fan-out parent. Holds one postgres claim-producer claim under the
      `@items-queue` pick policy; partition_request reads the
      operator-posted `fanout_seed.items` array. The postgres claim
      producer's SplitScope decodes the `{"list": [...]}` shape and emits one
      SubScopeDescriptor per element.
    claim_producers:
      - name: claim-producer-postgres
        selector: "@items-queue"
        intent: rw
        alias: pg_queue
    subscribes:
      - node: fanout_seed
        type: terminal/success
        force_upstream_refresh: false
    fan_out:
      claim: pg_queue
      partition_request: "{\"list\":{{messages.fanout_seed.items}}}"
      error_policy:
        kind: best_effort
    attributes:
      schema:
        type: object
        properties:
          partition_key:
            type: string
            source: "{{child.partition_key}}"
          processed_payload:
            type: object
            source: "{{claim.pg_queue.payload}}"
        required: [partition_key]
