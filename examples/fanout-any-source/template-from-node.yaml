# template-from-node.yaml — STORY-fanout-any-substitution-source half 1.
#
# A `prefilter` node (kind: attribute_passthrough) carries a literal
# `items` attribute (a JSON-array default). The fan-out node `triage`
# subscribes to it, reads `partition_request: "{{nodes.prefilter.attribute.items}}"`,
# and dispatches one child per item. The filesystem-store SplitScope
# decodes the list-array shape.
name: fanout-any-source-from-node
version: "1"
description: |
  STORY-fanout-any-substitution-source — partition_request source =
  upstream node attribute. The prefilter node's literal `items`
  attribute provides the list; the triage fan-out node substitutes
  it into its partition_request.

nodes:
  - type: prefilter
    kind: attribute_passthrough
    description: |
      Structural root. Provides a literal `items` list as an output
      attribute via the JSON-schema `default:` value. With no
      author-declared subscriptions, prefilter wakes on the implicit
      empty-message trigger the runtime seeds at registration.
    attributes:
      schema:
        type: object
        properties:
          items:
            type: array
            default:
              - { key: "a", payload: {} }
              - { key: "b", payload: {} }
              - { key: "c", payload: {} }
        required: [items]

  - type: triage
    kind: attribute_passthrough
    description: |
      The fan-out node: partition_request substitutes the prefilter
      node's `items` attribute. Subscribes to prefilter so the
      substitution-ref coverage check is satisfied.
    claim_producers:
      - name: fs-store
        selector: "@seed-queue"
        intent: rw
        alias: fs_queue
    subscribes:
      - node: prefilter
        type: terminal/success
        wake_on_change: true
        force_upstream_refresh: false
      - node: prefilter
        type: attribute/items/changed
        wake_on_change: false
        force_upstream_refresh: false
    fan_out:
      claim: fs_queue
      partition_request: "{\"list\":{{nodes.prefilter.attribute.items}}}"
      error_policy:
        kind: best_effort
    attributes:
      schema:
        type: object
        properties:
          partition_key:
            type: string
            source: "{{child.partition_key}}"
        required: [partition_key]
