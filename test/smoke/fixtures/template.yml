# §11.5 worked example — the smoke fixture's reference template.
#
# This file is documentary: the smoke test in
# `stores_redesign_smoke_test.go` builds the same structure
# programmatically (because the four-node body is built into the JSON
# POST body to `/templates`, and the deviations below are easier to
# express in code than to thread through a YAML→JSON converter at test
# time). The shapes here mirror what the smoke test actually deploys —
# i.e. the current `nodeStoreRefJSON` grammar (`name`/`selector`/
# `intent`/`alias?`) — so a future contributor can read the canonical
# template alongside the smoke fixture.
#
# Per the 2026-04-30 stores-protocol-cleanup, rimsky carries only a
# success/failure binary across the wire (success → `Commit`; failure
# → `Abandon`). Substrate disposition (e.g. promote-to-tail vs.
# release-to-back vs. delete) lives in each store-service's own config,
# not in the template. There is no `claim_resolutions:` block, no
# `policy_override` argument, and no `Delete` verb.
#
# Differences between this YAML and what the smoke test actually deploys:
#   - The `quality_rules: must_match_regex` entry on `draft` is omitted
#     from the deployed body. v1 only ships row_count_ratio / no_nulls /
#     nullable_fields_present (see `core/qualityrule/rules.go`); spec
#     §15 promises must_match_regex but it is not yet implemented.
#   - The `model-budget` lock limit is 50 (§19.2 requirement; the spec
#     example calls it "illustrative — set high in the smoke fixture").
#     Limits live in operator config (`named_locks:` per spec §6.1);
#     templates reference locks by name only.
frame_resolution_mode: serial_queue
frame_timeout_ms: 600000
nodes:
  # Pure-infra node: no executor, just claims from a ring buffer via the
  # `@review-queue` store-side pick policy and populates attributes
  # from the claim payload. The held claim is auto-released at
  # holding-subgraph completion (acquirer + downstream `review` inheritor).
  - type: claim-topic
    schedule: "* * * * *"
    stores:
      - { name: topics-ring, selector: "@review-queue", intent: rw }
    attributes:
      schema:
        type: object
        properties:
          area:     { type: string, source: "{{claim.topics-ring.payload.area}}" }
          subtopic: { type: string, source: "{{claim.topics-ring.payload.subtopic}}" }
        required: [area, subtopic]
    locks:
      - { name: "topics-ring:concurrent-claims" }

  # Post-2026-05-14 subscription-cascade resolution: cascade coupling is
  # declared receiver-side via `subscribes:`; the substitution-ref
  # parser auto-subscribes on `{{nodes.<X>.attribute.<Y>}}` so the
  # explicit `subscribes:` entries below mirror what the parser would
  # infer. The middle `action: invalidate` self-edge retires entirely
  # — the retry-twice-then-give-up intent survives via the retry cap.
  - type: scope
    executor: claude-agent
    attributes:
      schema:
        type: object
        properties:
          area:        { type: string, source: "{{nodes.claim-topic.attribute.area}}" }
          subtopic:    { type: string, source: "{{nodes.claim-topic.attribute.subtopic}}" }
          scope_notes: { type: string }
        required: [scope_notes]
    userdata:
      model: claude-sonnet-4-6
      system_prompt_ref: "scope-system.md"
    locks:
      - { name: model-budget }
    error_types:
      review_rejected:
        policy:
          - { action: discard_then_retry, count: 2 }
          - { action: give_up }

  - type: draft
    executor: claude-agent
    attributes:
      schema:
        type: object
        properties:
          area:        { type: string, source: "{{nodes.claim-topic.attribute.area}}" }
          subtopic:    { type: string, source: "{{nodes.claim-topic.attribute.subtopic}}" }
          scope_notes: { type: string, source: "{{nodes.scope.attribute.scope_notes}}" }
        required: [area, subtopic, scope_notes]
    stores:
      - name: content
        selector: "items/{{nodes.claim-topic.attribute.area}}/{{nodes.claim-topic.attribute.subtopic}}.md"
        intent: rw
    userdata:
      model: claude-sonnet-4-6
      system_prompt_ref: "draft-system.md"
    quality_rules:
      - { type: must_match_regex, target: write, pattern: "^---\\n", severity: error }
    locks:
      - { name: model-budget }

  - type: review
    executor: claude-agent
    attributes:
      schema:
        properties:
          accepted: { type: boolean }
          notes:    { type: string }
        required: [accepted]
    stores:
      - name: content
        selector: "items/{{nodes.claim-topic.attribute.area}}/{{nodes.claim-topic.attribute.subtopic}}.md"
        intent: r
    inherits:
      - { claim: topics-ring }
    userdata:
      model: claude-sonnet-4-6
      system_prompt_ref: "review-system.md"
    locks:
      - { name: model-budget }
