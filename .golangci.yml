issues:
  # node_modules occasionally ships stray Go files (e.g. the npm
  # `flatted` package ships `golang/pkg/flatted/flatted.go`). Skip
  # them globally so a `npm install` in lib/services/executors/*/
  # doesn't suddenly fail `make lint`. `exclude-dirs` is a list of
  # regexps (NOT globs), so a bare `node_modules` matches the segment
  # anywhere in the path.
  exclude-dirs:
    - "node_modules"
linters:
  enable:
    - depguard
    - gofmt
    - goimports
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - revive
linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  depguard:
    rules:
      pgx-isolation:
        list-mode: lax
        files:
          - "$all"
          - "!**/foundation/persistence/postgres/**"
          - "!**/foundation/internal/pgtest/**"
          - "!**/foundation/pgpool/**"
          - "!**/cmd/**"
          - "!**/test/support/pgdbtest/**"
          - "!**/testpg/**"
          - "!**/test/support/scenario/**"
          - "!**/claim_producers/**"
          - "!**/sensors/**"
          - "!**/subscribers/**"
          - "!**/test/smoke/**"
          - "!**/lib/services/test/scenarios/**"
        deny:
          - pkg: "github.com/jackc/pgx/v5"
            desc: "pgx is allowed only in foundation/persistence/postgres/, foundation/internal/pgtest/, foundation/pgpool/, cmd/, test/support/pgdbtest/, test/support/testpg/, test/support/scenario/, test/support/claim_producers/, sensors/, subscribers/, test/smoke/, lib/services/test/scenarios/, lib/services/claim_producers/, lib/services/sensors/, and lib/services/subscribers/. Use the persistence interfaces."
          - pkg: "github.com/jackc/pgx/v5/pgxpool"
            desc: "see pgx isolation rule above"
          - pkg: "github.com/jackc/pgx/v5/pgconn"
            desc: "see pgx isolation rule above"
      foundation-internal-isolation:
        list-mode: lax
        files:
          - "$all"
          - "!**/foundation/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/foundation/internal"
            desc: "foundation/internal/ is private to the foundation module. Use the public foundation packages."
      # protocols-purity: the protocols module is the implementer-facing
      # public contract surface. Its dependency budget is stdlib + grpc +
      # protobuf + uuid + yaml.v3 — no test infrastructure. No imports from
      # foundation/, internal/, graph/, runtime/, control/, or cmd/.
      protocols-purity:
        list-mode: lax
        files:
          - "**/protocols/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/foundation"
            desc: "the protocols module imports only stdlib + grpc + protobuf + uuid + yaml.v3. foundation/ is rimsky-internal."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/graph"
            desc: "the protocols module must not import graph/ (rimsky-internal layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/runtime"
            desc: "the protocols module must not import runtime/ (rimsky-internal layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/control"
            desc: "the protocols module must not import control/ (rimsky-internal layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "the protocols module must not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/testcontainers/testcontainers-go"
            desc: "the protocols module is the public contract surface; no test infrastructure."
      # foundation-purity: foundation/ depends only on protocols/ + stdlib + minimal third-party.
      # Applies unconditionally — the persistable row-type primitives that
      # foundation/persistence needs live in foundation/spec/ (moved from
      # graph/node/ in the 2026-05-13 back-import-elimination cycle).
      foundation-purity:
        list-mode: lax
        files:
          - "**/foundation/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/graph"
            desc: "foundation/ may not import graph/ (four-layer ordering: foundation < graph < runtime < control). Persistable row-type primitives live in foundation/spec/."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/runtime"
            desc: "foundation/ may not import runtime/ (four-layer ordering)."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/control"
            desc: "foundation/ may not import control/ (four-layer ordering)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "foundation/ may not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/test/support/claim_producers"
            desc: "foundation/ may not import test/support/claim_producers/ (test-support stubs)."
          - pkg: "github.com/rimsky-ai/rimsky-core/test/support/executors"
            desc: "foundation/ may not import test/support/executors/ (test-support stubs)."
      # graph-purity: graph/ depends only on foundation/ + protocols/ + stdlib + third-party.
      # Documented residual: graph/scheduler imports runtime for ConductorArgs + sweep fns +
      # InvalidateNode / RecalculateNode — the scheduler tick drives runtime sweeps. Flagged
      # for separate follow-up (likely needs scheduler split: graph-side fan-out vs runtime
      # tick orchestration). The scenario harness that boots the full stack now lives at
      # test/support/scenario/, outside the graph/ glob, so it is not subject to this rule.
      graph-purity:
        list-mode: lax
        files:
          - "**/graph/**"
          - "!**/graph/scheduler/scheduler.go"
          - "!**/graph/scheduler/pure_cascade.go"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/runtime"
            desc: "graph/ may not import runtime/ (four-layer ordering: foundation < graph < runtime < control). Exception: graph/scheduler/{scheduler.go,pure_cascade.go} imports runtime for sweep entry points — documented residual flagged for separate follow-up."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/control"
            desc: "graph/ may not import control/ (four-layer ordering)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "graph/ may not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/test/support/claim_producers"
            desc: "graph/ may not import test/support/claim_producers/ (test-support stubs)."
          - pkg: "github.com/rimsky-ai/rimsky-core/test/support/executors"
            desc: "graph/ may not import test/support/executors/ (test-support stubs). The scenario harness that boots reference executors now lives at test/support/scenario/, outside the graph/ glob."
      # runtime-purity: runtime/ depends only on foundation/ + graph/ + protocols/ + stdlib + third-party.
      # runtime is the bridge layer; it freely consumes foundation primitives and graph types.
      runtime-purity:
        list-mode: lax
        files:
          - "**/runtime/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/control"
            desc: "runtime/ may not import control/ (four-layer ordering: foundation < graph < runtime < control)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "runtime/ may not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/test/support/claim_producers"
            desc: "runtime/ may not import test/support/claim_producers/ (test-support stubs)."
          - pkg: "github.com/rimsky-ai/rimsky-core/test/support/executors"
            desc: "runtime/ may not import test/support/executors/ (test-support stubs)."
      # consumption-side-isolation: lib/services/ is the in-tree home of the
      # bundled consumption-side services (claim_producers, sensors, subscribers,
      # executors) that rimsky ships as images. Their shipped packages implement
      # against lib/protocols/ only — but the lib/services module's go.mod also
      # requires the root module and lib/foundation (for its own out-of-tree
      # test tree under lib/services/test/, which never ships), so the module
      # graph does NOT by itself block a shipped package from importing a
      # rimsky-internal layer (foundation, graph, runtime, control, cmd). This
      # depguard rule is therefore the primary guard against that edge, not
      # merely defense-in-depth.
      #
      # The root-anchored globs (claim_producers/**, sensors/**, subscribers/**,
      # executors/**) are intentionally distinct from the workspace-rooted
      # `**/lib/services/**` form: depending on how golangci-lint resolves
      # paths when linting the lib/services module (module-relative vs.
      # workspace-relative vs. absolute), one form or the other is the one
      # that matches. Listing both keeps the rule effective in every case.
      #
      # The lib/services/test/ tree is out-of-tree test machinery, NOT
      # shipped image code: the CLICTRL acceptance scenarios there boot the
      # real assembled product and drive real CLI entrypoints (cmd/rimsky/cli)
      # in-process against it. That test scaffolding is exempt from the
      # isolation rule (the negated `**/test/**` globs below) — the boundary
      # exists to keep the SHIPPED bundled-service packages (claim_producers/, sensors/,
      # subscribers/, executors/) isolated, not the harness/scenario tree.
      consumption-side-isolation:
        list-mode: lax
        files:
          - "**/lib/services/**"
          - "!**/lib/services/test/**"
          - "claim_producers/**"
          - "sensors/**"
          - "subscribers/**"
          - "executors/**"
          - "!**/test/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/foundation"
            desc: "Consumption-side binaries implement against protocols/ only. foundation/ is rimsky-internal."
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/graph"
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/runtime"
          - pkg: "github.com/rimsky-ai/rimsky-core/lib/control"
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
