linters:
  enable:
    - depguard
    - gofmt
    - goimports
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - revive
linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  depguard:
    rules:
      pgx-isolation:
        list-mode: lax
        files:
          - "$all"
          - "!**/foundation/persistence/postgres/**"
          - "!**/foundation/internal/pgtest/**"
          - "!**/cmd/**"
          - "!**/internal/pgmigrate/**"
          - "!**/testpg/**"
          - "!**/graph/scenario/**"
          - "!**/stores/**"
          - "!**/sensors/**"
          - "!**/subscribers/**"
          - "!**/test/smoke/**"
        deny:
          - pkg: "github.com/jackc/pgx/v5"
            desc: "pgx is allowed only in foundation/persistence/postgres/, foundation/internal/pgtest/, cmd/, internal/pgmigrate/, testpg/, graph/scenario/, stores/, sensors/, subscribers/, and test/smoke/. Use the persistence interfaces."
          - pkg: "github.com/jackc/pgx/v5/pgxpool"
            desc: "see pgx isolation rule above"
          - pkg: "github.com/jackc/pgx/v5/pgconn"
            desc: "see pgx isolation rule above"
      foundation-internal-isolation:
        list-mode: lax
        files:
          - "$all"
          - "!**/foundation/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/foundation/internal"
            desc: "foundation/internal/ is private to the foundation module. Use the public foundation packages."
      # protocols-purity: the protocols module is the implementer-facing
      # public contract surface. Its dependency budget is stdlib + grpc +
      # protobuf + uuid + yaml.v3 — no test infrastructure. No imports from
      # foundation/, internal/, graph/, runtime/, control/, or cmd/.
      protocols-purity:
        list-mode: lax
        files:
          - "**/protocols/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/foundation"
            desc: "the protocols module imports only stdlib + grpc + protobuf + uuid + yaml.v3. foundation/ is rimsky-internal."
          - pkg: "github.com/rimsky-ai/rimsky-core/internal"
            desc: "internal/ is private to rimsky."
          - pkg: "github.com/rimsky-ai/rimsky-core/graph"
            desc: "the protocols module must not import graph/ (rimsky-internal layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/runtime"
            desc: "the protocols module must not import runtime/ (rimsky-internal layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/control"
            desc: "the protocols module must not import control/ (rimsky-internal layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "the protocols module must not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/testcontainers/testcontainers-go"
            desc: "the protocols module is the public contract surface; no test infrastructure."
      # foundation-purity: foundation/ depends only on protocols/ + stdlib + minimal third-party.
      # Applies unconditionally — the persistable row-type primitives that
      # foundation/persistence needs live in foundation/spec/ (moved from
      # graph/node/ in the 2026-05-13 back-import-elimination cycle).
      foundation-purity:
        list-mode: lax
        files:
          - "**/foundation/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/graph"
            desc: "foundation/ may not import graph/ (four-layer ordering: foundation < graph < runtime < control). Persistable row-type primitives live in foundation/spec/."
          - pkg: "github.com/rimsky-ai/rimsky-core/runtime"
            desc: "foundation/ may not import runtime/ (four-layer ordering)."
          - pkg: "github.com/rimsky-ai/rimsky-core/control"
            desc: "foundation/ may not import control/ (four-layer ordering)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "foundation/ may not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/stores"
            desc: "foundation/ may not import stores/ (stores are consumption-side binaries)."
          - pkg: "github.com/rimsky-ai/rimsky-core/executors"
            desc: "foundation/ may not import executors/ (executors are consumption-side binaries)."
      # graph-purity: graph/ depends only on foundation/ + protocols/ + stdlib + third-party.
      # Documented residual: graph/scheduler imports runtime for ConductorArgs + sweep fns +
      # InvalidateNode / RecalculateNode — the scheduler tick drives runtime sweeps. Flagged
      # for separate follow-up (likely needs scheduler split: graph-side fan-out vs runtime
      # tick orchestration). graph/scenario/ exempt because it boots the full stack for
      # scenario tests.
      graph-purity:
        list-mode: lax
        files:
          - "**/graph/**"
          - "!**/graph/scenario/**"
          - "!**/graph/scheduler/scheduler.go"
          - "!**/graph/scheduler/pure_cascade.go"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/runtime"
            desc: "graph/ may not import runtime/ (four-layer ordering: foundation < graph < runtime < control). Exception: graph/scheduler/{scheduler.go,pure_cascade.go} imports runtime for sweep entry points — documented residual flagged for separate follow-up. graph/scenario/ is exempt because it boots the full stack for scenario tests."
          - pkg: "github.com/rimsky-ai/rimsky-core/control"
            desc: "graph/ may not import control/ (four-layer ordering)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "graph/ may not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/stores"
            desc: "graph/ may not import stores/ (stores are consumption-side binaries)."
          - pkg: "github.com/rimsky-ai/rimsky-core/executors"
            desc: "graph/ may not import executors/ (executors are consumption-side binaries). Exception: graph/scenario/ boots reference executors for scenario tests."
      # runtime-purity: runtime/ depends only on foundation/ + graph/ + protocols/ + stdlib + third-party.
      # runtime is the bridge layer; it freely consumes foundation primitives and graph types.
      runtime-purity:
        list-mode: lax
        files:
          - "**/runtime/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/control"
            desc: "runtime/ may not import control/ (four-layer ordering: foundation < graph < runtime < control)."
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
            desc: "runtime/ may not import cmd/ (cmd is the topmost binary layer)."
          - pkg: "github.com/rimsky-ai/rimsky-core/stores"
            desc: "runtime/ may not import stores/ (stores are consumption-side binaries)."
          - pkg: "github.com/rimsky-ai/rimsky-core/executors"
            desc: "runtime/ may not import executors/ (executors are consumption-side binaries)."
      # consumption-side-isolation: stores/, sensors/, subscribers/, executors/
      # are bundled reference impls that the 2026-05-24 reorganization
      # moved out of this repo. They must implement against protocols/ only;
      # importing rimsky-internal packages would prevent that separation.
      # The `files:` targets no longer have local matches in rimsky; the
      # rule stays as a defensive guard against re-bundling.
      #
      # The in-repo stub claim-producer (stores/stub/**) and stub executor
      # (executors/stub/**) deliberately stayed in rimsky as test
      # infrastructure (Apache-classified rimsky-internal carve-outs), so
      # they are exempt — they may consume rimsky-internal helpers such as
      # internal/ops. The bare stores/**, executors/** globs over-match the
      # stub, hence the !stores/stub/** and !executors/stub/** exclusions.
      consumption-side-isolation:
        list-mode: lax
        # Root-anchored patterns intentionally — the spec's
        # `**/stores/**` would also match `test/scenarios/stores/`,
        # which is rimsky-internal scenario test code, not bundled
        # consumption-side binaries scheduled to move out. The
        # production consumption-side directories live only at the
        # repo root (`stores/`, `sensors/`, `subscribers/`,
        # `executors/`); the in-tree scenario tests under
        # `test/scenarios/stores/` will be addressed by P3.4.
        files:
          - "stores/**"
          - "!stores/stub/**"
          - "sensors/**"
          - "subscribers/**"
          - "executors/**"
          - "!executors/stub/**"
        deny:
          - pkg: "github.com/rimsky-ai/rimsky-core/foundation"
            desc: "Consumption-side binaries implement against protocols/ only. foundation/ is rimsky-internal."
          - pkg: "github.com/rimsky-ai/rimsky-core/internal"
            desc: "internal/ is private to rimsky."
          - pkg: "github.com/rimsky-ai/rimsky-core/graph"
          - pkg: "github.com/rimsky-ai/rimsky-core/runtime"
          - pkg: "github.com/rimsky-ai/rimsky-core/control"
          - pkg: "github.com/rimsky-ai/rimsky-core/cmd"
