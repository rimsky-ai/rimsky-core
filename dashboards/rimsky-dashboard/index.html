<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP per spec §5.6: forbid inline script (no 'unsafe-inline'),
      lock connect-src to the dashboard's own origin (the proxy
      collapses CORS for executor/store backends), allow frame-src *
      so operator-declared CustomUI panels can render in iframes.
      Vite dev server injects HMR via a connection to ws: which is
      separately allowed in dev mode by the dev server's own headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' *; font-src 'self' data:; base-uri 'self'; form-action 'self';"
    />
    <title>Rimsky Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
